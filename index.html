<style>
:root{--bg:#090b12;--panel:rgba(17,20,34,.88);--border:rgba(139,92,246,.24);--text:#f1f5f9;--muted:#94a3b8}
*{box-sizing:border-box;font-family:'Orbitron','Inter',system-ui,-apple-system,sans-serif!important}
body,button,input,select,option,textarea,optgroup{font-family:'Orbitron','Inter',system-ui,-apple-system,sans-serif!important;letter-spacing:.02em}
select,select option,select optgroup{background-color:#0d101a!important;color:#f1f5f9!important;font-family:'Orbitron','Inter',sans-serif!important}
body{background:radial-gradient(circle at 12% 14%,rgba(99,102,241,.18),transparent 38%),radial-gradient(circle at 88% 18%,rgba(236,72,153,.14),transparent 36%),radial-gradient(circle at 50% 88%,rgba(6,182,212,.12),transparent 42%),var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.ttl{font-family:'Orbitron',sans-serif!important;letter-spacing:.04em}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
.glass{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

}
.will-change-transform{will-change:transform}
.btn{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 52%,#ec4899 100%);color:#fff;font-weight:700;font-size:.78rem;padding:.52rem 1rem;border-radius:8px;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;box-shadow:0 4px 16px rgba(139,92,246,.32);border:1px solid rgba(255,255,255,.16);cursor:pointer}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 6px 22px rgba(236,72,153,.4)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.gold{background:linear-gradient(90deg,#b45309,#f59e0b,#fde047);color:#1c1003;box-shadow:0 4px 18px rgba(245,158,11,.35)}.btn.gold:hover{filter:brightness(1.1)}
.btn.crimson{background:linear-gradient(135deg,#dc2626 0%,#db2777 55%,#7c3aed 100%);color:#fff;box-shadow:0 4px 18px rgba(225,29,72,.38)}
.btn2{background:rgba(99,102,241,.08);border:1px solid rgba(139,92,246,.28);color:#e2e8f0;padding:.42rem .75rem;border-radius:8px;font-size:.75rem;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;cursor:pointer}
.btn2:hover{background:rgba(139,92,246,.2);border-color:rgba(236,72,153,.45);color:#fff}
.btn2:disabled{opacity:.4;pointer-events:none}
input,select,textarea{background:#0b0e18;border:1px solid rgba(139,92,246,.28);border-radius:8px;padding:.45rem .65rem;color:var(--text);max-width:100%;font-size:.78rem;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#ec4899;box-shadow:0 0 0 2px rgba(236,72,153,.2)}
.tab{padding:.45rem .85rem;border-radius:8px;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.74rem;transition:all .15s;flex-shrink:0;display:inline-flex;align-items:center;gap:.35rem;letter-spacing:.03em;border:1px solid transparent;cursor:pointer}
.tab:hover{color:#fff;background:rgba(139,92,246,.1)}
.tab.on{background:linear-gradient(135deg,rgba(99,102,241,.28),rgba(236,72,153,.22));color:#fff;border:1px solid rgba(168,85,247,.55);box-shadow:0 0 14px rgba(139,92,246,.25)}
.card{position:relative;aspect-ratio:2/3;border-radius:10px;border:2px solid var(--bc,#52525b);overflow:hidden;cursor:pointer;background:#141720;transform:perspective(800px) rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .15s ease,box-shadow .2s ease;user-select:none;will-change:transform}
.art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,hsl(var(--hue),35%,22%),#0e1017)}
.art b{font-size:2.6rem;opacity:.25;font-weight:800}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nm{position:absolute;left:0;right:0;bottom:0;padding:.55rem .55rem .45rem;background:linear-gradient(transparent,rgba(5,7,14,.94) 45%,#05070e);font-size:.68rem;font-weight:700;line-height:1.15}
.nm .cdesc{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:.52rem;color:#94a3b8;font-weight:500;margin-top:2px}
.nm .val{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:.64rem;font-weight:800;color:#fcd34d}
.rl{position:absolute;top:5px;left:5px;font-size:.52rem;padding:1px 6px;border-radius:99px;background:rgba(9,11,16,.88);border:1px solid rgba(255,255,255,.15);color:var(--bc);font-weight:800;z-index:3}
.tp{position:absolute;top:23px;left:5px;font-size:.46rem;padding:1px 5px;border-radius:4px;background:rgba(9,11,16,.88);color:#38bdf8;font-weight:700;letter-spacing:.03em;z-index:3}
.tp.f{color:#c084fc}
.cnt{position:absolute;top:6px;right:6px;z-index:6;background:linear-gradient(135deg,#4f46e5,#ec4899);color:#fff;font-weight:800;font-size:.66rem;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:1px 6px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.shine{position:absolute;inset:0;opacity:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 65%);background-size:250% 100%;background-position:var(--mx,50%) 0;mix-blend-mode:overlay;transition:opacity .2s;z-index:2}
.tilt:hover .shine{opacity:.6}
.r-C{--bc:#94a3b8}.r-R{--bc:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.16)}.r-E{--bc:#a855f7;box-shadow:0 0 14px rgba(168,85,247,.25)}
.r-L{--bc:#eab308;box-shadow:0 0 18px rgba(234,179,8,.34)}.r-L .shine{opacity:.35}
.r-M{--bc:#f472b6;border-color:transparent;box-shadow:0 0 22px rgba(236,72,153,.42);background:linear-gradient(#141720,#141720) padding-box,linear-gradient(125deg,#f472b6,#60a5fa,#facc15,#34d399,#a78bfa,#f472b6) border-box}
.r-M .shine{background:linear-gradient(115deg,#f472b6,#60a5fa,#facc15,#34d399,#a78bfa,#f472b6);background-size:300%;mix-blend-mode:color-dodge;opacity:.48}
.back{background:radial-gradient(circle at 50% 50%,#251e42 0%,#0d101a 100%);border-color:rgba(139,92,246,.55);box-shadow:0 12px 30px rgba(0,0,0,.75),0 0 18px rgba(99,102,241,.25);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:900;letter-spacing:.15em;color:#a5b4fc}
.slab{background:linear-gradient(180deg,rgba(99,102,241,.1),rgba(236,72,153,.06));border:1px solid rgba(168,85,247,.32);border-radius:10px;padding:5px}
.slab .lab{display:flex;justify-content:space-between;background:linear-gradient(90deg,#e0e7ff,#fce7f3);color:#090b10;border-radius:4px;padding:2px 6px;font-size:.55rem;margin-bottom:4px;font-weight:800}
.sel{outline:2px solid #ec4899;outline-offset:2px;border-radius:12px;box-shadow:0 0 16px rgba(236,72,153,.4)}
.atk-sel{outline:3px solid #38bdf8;outline-offset:3px;border-radius:12px;box-shadow:0 0 24px rgba(56,189,248,.65);transform:translateY(-6px)}
.tgt-ready{outline:2px dashed rgba(244,63,94,.75);outline-offset:2px;border-radius:12px;cursor:crosshair}
.tgt-ready:hover{outline:3px solid #f43f5e;box-shadow:0 0 22px rgba(244,63,94,.6);transform:scale(1.03)}
.ko-unit{filter:grayscale(1) contrast(.8);opacity:.38;pointer-events:none}
.pack{position:relative;width:220px;height:340px;margin:auto;border-radius:8px;background:linear-gradient(135deg,#1d1936 0%,#0f1326 45%,#1c1635 75%,#090b14 100%);border:1px solid rgba(168,85,247,.55);box-shadow:0 22px 48px rgba(0,0,0,.85),0 0 28px rgba(139,92,246,.25),inset 0 0 24px rgba(236,72,153,.12);cursor:pointer;transition:transform .35s cubic-bezier(.2,1,.3,1),box-shadow .35s ease,opacity .45s ease;overflow:hidden;user-select:none;will-change:transform}
.pack::before,.pack::after{content:"";position:absolute;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0,rgba(255,255,255,.18) 2px,rgba(0,0,0,.5) 2px,rgba(0,0,0,.5) 5px),linear-gradient(180deg,#312954,#0d111c);z-index:4;opacity:.75}
.pack::before{top:0;border-bottom:1px solid rgba(255,255,255,.22)}.pack::after{bottom:0;border-top:1px solid rgba(255,255,255,.22)}
.pack:hover{transform:translateY(-6px) scale(1.02);border-color:rgba(236,72,153,.75);box-shadow:0 28px 60px rgba(0,0,0,.92),0 0 38px rgba(236,72,153,.4)}
.pack-foil{position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,rgba(196,181,253,.22) 45%,rgba(236,72,153,.18) 52%,transparent 70%);background-size:250% 100%;transition:background-position .6s ease;pointer-events:none;z-index:3;mix-blend-mode:screen}
.pack:hover .pack-foil{background-position:100% 0}
.pack.torn{transform:translateY(-32px) rotate(5deg) scale(1.1);opacity:0}
.pack.gold{background:linear-gradient(135deg,#3a2a08 0%,#8a6414 30%,#f5d878 50%,#8a6414 70%,#3a2a08 100%);border-color:rgba(253,224,71,.85);box-shadow:0 22px 48px rgba(0,0,0,.8),0 0 40px rgba(250,204,21,.45);animation:goldPulse 2.4s ease-in-out infinite}
.pack.gold .pack-foil{background:linear-gradient(115deg,transparent 25%,rgba(253,224,71,.45) 48%,transparent 68%);background-size:250% 100%}
.pack.theme{background:linear-gradient(135deg,#3b0a1e 0%,#701a3c 35%,#311042 70%,#090d1a 100%);border-color:rgba(244,63,94,.8);box-shadow:0 22px 48px rgba(0,0,0,.85),0 0 42px rgba(244,63,94,.42),inset 0 0 26px rgba(56,189,248,.18);animation:themePulse 2.6s ease-in-out infinite}
.pack.theme .pack-foil{background:linear-gradient(115deg,transparent 22%,rgba(244,63,94,.35) 45%,rgba(56,189,248,.3) 54%,transparent 72%);background-size:250% 100%}
@keyframes goldPulse{50%{box-shadow:0 22px 48px rgba(0,0,0,.8),0 0 70px rgba(250,204,21,.75)}}
@keyframes themePulse{50%{box-shadow:0 22px 48px rgba(0,0,0,.85),0 0 65px rgba(244,63,94,.68)}}
@keyframes fl{from{opacity:0;transform:rotateY(85deg) scale(.88)}to{opacity:1;transform:rotateY(0) scale(1)}}
@keyframes fR{50%{box-shadow:0 0 28px 4px rgba(59,130,246,.45)}}
@keyframes fE{50%{box-shadow:0 0 42px 8px rgba(168,85,247,.5)}}
@keyframes fL{0%,100%{box-shadow:0 0 35px 6px rgba(234,179,8,.5)}50%{box-shadow:0 0 95px 28px rgba(250,204,21,.85)}}
@keyframes fM{0%{box-shadow:0 0 60px 18px rgba(244,114,182,.75)}33%{box-shadow:0 0 95px 30px rgba(96,165,250,.85)}66%{box-shadow:0 0 95px 30px rgba(250,204,21,.85)}100%{box-shadow:0 0 60px 18px rgba(52,211,153,.75)}}
@keyframes shk{15%{transform:translate(-8px,5px) rotate(-1deg)}30%{transform:translate(8px,-5px) rotate(1deg)}45%{transform:translate(-6px,-4px)}60%{transform:translate(6px,4px)}75%{transform:translate(-3px,2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flashScreen{0%{opacity:.85}100%{opacity:0}}
@keyframes partOut{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
.fx-C{animation:fl .32s ease-out}.fx-R{animation:fl .38s ease-out,fR 1s}.fx-E{animation:fl .45s ease-out,fE 1.2s}
.fx-L{animation:fl .55s ease-out,fL 1.8s infinite}.fx-M{animation:fl .65s ease-out,fM 2.2s infinite}
.shake{animation:shk .55s ease-in-out}
.halo-L{position:absolute;inset:-28%;background:conic-gradient(from 0deg,transparent,rgba(250,204,21,.45),transparent,rgba(245,158,11,.45),transparent);filter:blur(32px);animation:spin 4s linear infinite;pointer-events:none;z-index:0}
.halo-M{position:absolute;inset:-32%;background:conic-gradient(#f472b6,#60a5fa,#facc15,#34d399,#a78bfa,#f472b6);filter:blur(36px);opacity:.65;animation:spin 3s linear infinite;pointer-events:none;z-index:0}
.screen-flash{position:fixed;inset:0;z-index:90;pointer-events:none;animation:flashScreen .85s ease-out forwards}
.ptc{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:99px;pointer-events:none;z-index:20;animation:partOut .95s cubic-bezier(.16,1,.3,1) forwards}
.scan{position:absolute;left:0;right:0;height:2px;background:#ec4899;box-shadow:0 0 12px #ec4899;animation:sc 1s ease-in-out infinite alternate;z-index:5}
@keyframes sc{from{top:0}to{top:100%}}
.stats p{display:flex;justify-content:space-between;border-bottom:1px solid rgba(139,92,246,.15);padding:.42rem 0}
.scroll-y{max-height:9rem;overflow-y:auto;padding-right:.4rem}
.scroll-y::-webkit-scrollbar{width:5px}.scroll-y::-webkit-scrollbar-thumb{background:rgba(168,85,247,.4);border-radius:9px}
.coin-dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:linear-gradient(135deg,#fde047,#f59e0b);box-shadow:0 0 8px #fbbf24;vertical-align:middle;margin-right:3px}
.radar-ring{width:64px;height:64px;border-radius:9999px;border:3px solid rgba(236,72,153,.25);border-top-color:#ec4899;border-right-color:#38bdf8;animation:spin 1s linear infinite}
.lb-row{display:grid;grid-template-columns:2.4rem minmax(0,1fr) 6.2rem 4.6rem 4.4rem;gap:.5rem;align-items:center}
.lb-gold{background:linear-gradient(90deg,rgba(250,204,21,.22),rgba(250,204,21,.04));border:1px solid rgba(250,204,21,.5)}
.lb-silver{background:linear-gradient(90deg,rgba(203,213,225,.2),rgba(203,213,225,.04));border:1px solid rgba(203,213,225,.45)}
.lb-bronze{background:linear-gradient(90deg,rgba(251,146,60,.2),rgba(251,146,60,.04));border:1px solid rgba(251,146,60,.45)}
</style>

        </div>
        <div class="flex items-center gap-1 sm:gap-2 shrink-0">

    </div>

</div>

function toLightCard(x){
  const isShonen=Boolean(x.shonen||(!x.adult&&((x.desc||'').includes('Action')||(x.desc||'').includes('Aventure')||(x.desc||'').includes('Surnaturel')||x.kind==='c')));

/* Lecture asynchrone à la demande depuis IndexedDB (avec petit cache LRU de 150 entrées max) */
async function getCardDetails(id){
  if(DETAIL_CACHE.has(id))return DETAIL_CACHE.get(id);
  const base=cd(id);
  const full=await idbGet(id);
  const merged=full?{...base,desc:full.desc||'Carte du catalogue AnimeCards.',img:full.img||''}:{...base,desc:'Carte du catalogue AnimeCards.',img:''};
  if(DETAIL_CACHE.size>=150){const firstKey=DETAIL_CACHE.keys().next().value;DETAIL_CACHE.delete(firstKey)}
  DETAIL_CACHE.set(id,merged);
  return merged;
}

/* Hydrate de façon asynchrone les images des cartes rendues à l'écran sans saturer la RAM */
let hydrateObserver=null;
function ensureHydrateObserver(){
  if(hydrateObserver||typeof IntersectionObserver==='undefined')return;
  hydrateObserver=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting)return;
      const el=en.target,cid=el.dataset.cid;
      hydrateObserver.unobserve(el);
      if(!cid)return;
      getCardDetails(cid).then(full=>{
        const art=el.querySelector('.art');
        if(art&&full.img&&!art.querySelector('img')){
          const im=document.createElement('img');
          im.src=full.img;im.referrerPolicy='no-referrer';im.loading='lazy';
          im.onerror=()=>im.remove();
          art.appendChild(im);
        }
        const ds=el.querySelector('.cdesc');
        if(ds&&full.desc)ds.textContent=full.desc;
      }).catch(()=>{});
    });
  },{rootMargin:'180px'});
}
function hydrateCardsDOM(root=document){
  ensureHydrateObserver();
  root.querySelectorAll('.card[data-cid]').forEach(el=>{
    if(el.dataset.hydrated==='1')return;
    el.dataset.hydrated='1';
    if(hydrateObserver)hydrateObserver.observe(el);
    else{
      const cid=el.dataset.cid;
      getCardDetails(cid).then(full=>{
        const art=el.querySelector('.art');
        if(art&&full.img&&!art.querySelector('img'))art.insertAdjacentHTML('beforeend',`<img src="${E(full.img)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">`);
        const ds=el.querySelector('.cdesc');if(ds&&full.desc)ds.textContent=full.desc;
      });
    }
  });
}

async function gql(q,v){
  for(let i=0;i<5;i++){
    const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:q,variables:v})});
    if(r.status===429){await sleep((+r.headers.get('retry-after')||20)*1000+1000);continue}
    if(!r.ok)throw new Error('AniList HTTP '+r.status);
    return (await r.json()).data.Page;
  }
  throw new Error('Limite de requêtes AniList atteinte');
}

function er(c){

  let i=RO.indexOf(c.rar);
  if(pr>=6)i+=2;else if(pr>=3)i+=1;else if(ratio<.4)i-=1;

}

const stacks=inv=>{const r=[];for(const id in inv||{}){if(isLegacyMusicId(id))continue;if(inv[id]?.q)r.push({id,g:0,n:inv[id].q});const m={};(inv[id]?.g||[]).forEach(x=>m[x]=(m[x]||0)+1);for(const g in m)r.push({id,g:+g,n:m[g]})}return r};
const invVal=inv=>stacks(inv).reduce((a,s)=>a+sellP(s.id,s.g)*s.n,0);
const keyOf=s=>s.id+'|'+s.g;
const parse=k=>{const [i,g]=String(k||'').split('|');return{id:i,g:+(g||0)}};

/* Charge l'inventaire d'un joueur depuis sa sous-collection Firestore users/{targetUid}/inventory */
async function fetchUserInventory(targetUid,fallbackInv=null){
  try{
    const snap=await getDocs(invCol(targetUid));
    const map={};
    snap.docs.forEach(d=>{
      if(isLegacyMusicId(d.id))return;
      const dt=d.data();
      const q=typeof dt.q==='number'?dt.q:0;
      const g=Array.isArray(dt.g)?dt.g:[];
      if(q>0||g.length>0)map[d.id]={q,g};
    });
    if(Object.keys(map).length>0||!fallbackInv)return map;
    return cl(fallbackInv);
  }catch(e){return cl(fallbackInv||{})}
}

/* Synchronise les différences d'inventaire dans la sous-collection users/{targetUid}/inventory/{cardId} via writeBatch */
async function syncInvSubcollection(targetUid,prevInv,nextInv,extraUserFields={}){
  const allIds=new Set([...Object.keys(prevInv||{}),...Object.keys(nextInv||{})]);
  const changed=[];
  for(const cid of allIds){
    const a=prevInv?.[cid],b=nextInv?.[cid];
    const aq=a?.q||0,bq=b?.q||0;
    const ag=(a?.g||[]).join(','),bg=(b?.g||[]).join(',');
    if(aq!==bq||ag!==bg)changed.push(cid);
  }
  const chunks=[];
  for(let i=0;i<changed.length;i+=400)chunks.push(changed.slice(i,i+400));
  if(!chunks.length)chunks.push([]);
  for(let idx=0;idx<chunks.length;idx++){
    const b=writeBatch(db);
    chunks[idx].forEach(cid=>{
      const item=nextInv?.[cid];
      if(!item||(!item.q&&(!item.g||!item.g.length)))b.delete(invDoc(targetUid,cid));
      else b.set(invDoc(targetUid,cid),{q:item.q||0,g:Array.isArray(item.g)?item.g:[]});
    });
    if(idx===chunks.length-1){
      b.update(doc(db,'users',targetUid),{val:invVal(nextInv),...extraUserFields});
    }
    await b.commit();
  }
  if(targetUid===uid)S.inv=cl(nextInv);
}

  const res=[];

  }
  return res.slice(0,5);
}

function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekKey(){
  const d=new Date();d.setHours(0,0,0,0);
  const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);
  return `${d.getFullYear()}-W${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function normQuests(q){

  if(res.dayKey!==tk){res.dayKey=tk;res.d_packs=0;res.d_bid=0;res.d_arena=0;res.claimedDaily=[]}
  if(res.weekKey!==wk){res.weekKey=wk;res.w_arenaWin=0;res.w_grade=0;res.w_packs=0;res.claimedWeekly=[]}
  if(!Array.isArray(res.claimedDaily))res.claimedDaily=[];
  if(!Array.isArray(res.claimedWeekly))res.claimedWeekly=[];
  return res;
}

}

/* Migration transparente de l'ancien objet users/{uid}.inv vers la sous-collection users/{uid}/inventory/{cardId} */
async function migrateLegacyAndInventory(){
  try{
    const u=S.u;if(!u)return;
    const subSnap=await getDocs(invCol(uid));
    const subMap={};
    subSnap.docs.forEach(d=>{
      if(!isLegacyMusicId(d.id)){
        const dt=d.data();
        if((dt.q||0)>0||(dt.g||[]).length>0)subMap[d.id]={q:dt.q||0,g:Array.isArray(dt.g)?dt.g:[]};
      }
    });
    const legacyInv=u.inv&&typeof u.inv==='object'?cl(u.inv):{};
    const hasLegacyKeys=Object.keys(legacyInv).length>0;
    let refundMusic=0;

    if(hasLegacyKeys&&!Object.keys(subMap).length){
      for(const k of Object.keys(legacyInv)){
        if(isLegacyMusicId(k)){refundMusic+=cntTotal(legacyInv,k);delete legacyInv[k]}
        else subMap[k]={q:legacyInv[k]?.q||0,g:Array.isArray(legacyInv[k]?.g)?legacyInv[k].g:[]};
      }
      await syncInvSubcollection(uid,{},subMap,{inv:{},invMigrated:true,ac:(u.ac||0)+refundMusic*10});
    }else{
      S.inv=subMap;
    }

    const upd={};
    if(u.elo===undefined){upd.elo=1000;upd.arenaWins=u.arenaWins||0;upd.arenaLosses=u.arenaLosses||0}
    if(Object.keys(upd).length)await saveU(upd);
    if(refundMusic>0)toast('Les anciennes cartes musicales ont été remboursées en AnimeCoins.');
  }catch(e){}
}

/* Pilier 4 : Particules strictement réservées aux cartes Légendaires (L) et Mythiques (M) */
function spawnParticles(rar){
  if(rar!=='L'&&rar!=='M')return '';
  const cols=rar==='M'?['#f472b6','#60a5fa','#facc15','#34d399','#a78bfa']:['#facc15','#f59e0b','#fde047','#ffffff'];let h='';
  for(let i=0;i<28;i++){const a=(Math.PI*2*i)/28+Math.random()*.3,d=95+Math.random()*95,c=cols[i%cols.length];
    h+=`<span class="ptc" style="background:${c};box-shadow:0 0 8px ${c};--tx:${Math.round(Math.cos(a)*d)}px;--ty:${Math.round(Math.sin(a)*d)}px"></span>`}
  return h;
}
async function pov(){
  const P=S.P;if(!P)return;
  const variant=P.welcome?'gold':P.isTheme?'theme':'std',th=THEMES[P.thKey]||THEMES.shonen;
  if(!P.tear)return modal(`<div class="text-center space-y-3"><div class="pack will-change-transform ${P.welcome?'gold':P.isTheme?'theme':''}" id="pk1" data-a="tear">${boosterVisualHTML('CLIQUE POUR DÉCHIRER',variant,P.isTheme?th.badge:'')}</div><p class="text-xs text-slate-400">Clique sur le booster pour l'ouvrir</p></div>`,1);
  const id=P.cs[P.i],c=await getCardDetails(id),prev=P.ownedBefore[P.i],isL=c.rar==='L',isM=c.rar==='M',hi=isL||isM;
  const flash=P.flip&&hi?`<div class="screen-flash" style="background:${isM?'radial-gradient(circle,rgba(244,114,182,.55),rgba(96,165,250,.45),transparent 75%)':'radial-gradient(circle,rgba(250,204,21,.55),transparent 75%)'}"></div>`:'';
  const badge=P.flip?(prev===0?`<div class="inline-flex px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 mb-2">NOUVELLE CARTE</div>`:`<div class="inline-flex px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/15 text-amber-300 border border-amber-400/30 mb-2">Déjà possédée (x${prev})</div>`):`<div class="h-6 mb-2"></div>`;
  const banner=P.flip&&hi?`<div class="mb-2 text-xs font-extrabold tracking-widest uppercase ${isM?'text-pink-400':'text-amber-300'} animate-pulse">TIRAGE EXCEPTIONNEL · ${R[c.rar].n.toUpperCase()} !</div>`:'';
  modal(`${flash}<div class="text-center w-60 sm:w-64 ${P.flip&&hi?'shake':''}">${banner}${badge}
    <div class="relative" data-a="nextC">${P.flip&&isL?'<div class="halo-L"></div>':''}${P.flip&&isM?'<div class="halo-M"></div>':''}${P.flip&&hi?spawnParticles(c.rar):''}
    ${P.flip?`<div class="relative z-10 fx-${c.rar}">${card(c)}</div>`:cardBackHTML()}</div>
    <p class="mt-4 text-xs text-slate-400">${P.i+1}/5 — ${P.flip?(P.i<4?'Clique pour la carte suivante':'Clique pour terminer'):'Clique sur la carte pour la révéler'}</p></div>`,1);
}

/* ============ 9. COLLECTION, ALBUMS & PAGINATION STRICTE (36 CARTES + insertAdjacentHTML) ============ */
function filtered(){
  const F=S.F,al=F.a?(U().albums||{})[F.a]||[]:null;
  return stacks(UInv()).filter(s=>{
    const c=cd(s.id);
    if(F.q&&!c.name.toLowerCase().includes(F.q.toLowerCase()))return false;
    if(F.r&&c.rar!==F.r)return false;
    if(F.g==='g'&&!s.g)return false;if(F.g==='u'&&s.g)return false;
    if(F.d&&s.n<2)return false;
    if(al&&!al.includes(keyOf(s)))return false;
    return true;
  }).sort((a,b)=>RO.indexOf(cd(b.id).rar)-RO.indexOf(cd(a.id).rar)||b.g-a.g||sellP(b.id,b.g)-sellP(a.id,a.g));

function colUpd(append=false){

function getCardMarketStats(id){
  const list=(S.allAuc||[]).filter(a=>a.card===id&&(a.status==='open'||a.bidder)),by={};

  const avgByGrade={};for(const g in by)avgByGrade[g]={avg:Math.round(by[g].reduce((s,v)=>s+v,0)/by[g].length),count:by[g].length};

/* ============ 10. GRADATION ============ */
function gradeListFiltered(){

  .sort((a,b)=>GF.s==='qty'?b.n-a.n||sellP(b.id,0)-sellP(a.id,0):GF.s==='name'?cd(a.id).name.localeCompare(cd(b.id).name):sellP(b.id,0)-sellP(a.id,0));

      <p class="text-xs text-slate-400">Coût : <b class="text-amber-300">100 AC</b> · Une note PSA 9 (x5) ou PSA 10 (x15) multiplie fortement la valeur et les stats ATK/HP en Arène.</p>
      <button class="btn w-full" data-a="gradeIt" ${(U().ac||0)<100?'disabled':''}>Lancer l'expertise (100 AC)</button>`:'<p class="text-xs text-slate-400 py-12">Sélectionne une carte non gradée dans la liste &rarr;</p>'}</div>

A.gradeIt=async()=>{
  const {id}=parse(S.G),inv=cl(UInv());if((U().ac||0)<100||!subC(inv,id,0))return;

function arenaItemHTML(s,dk){
  const k=keyOf(s),sel=dk.includes(k),pwr=cardPwr(s.id,s.g);
  return `<div class="space-y-1"><div class="relative ${sel?'sel':''}" data-a="pickDeck" data-p="${k}">${s.n>1?`<span class="cnt">x${s.n}</span>`:''}${slab(cd(s.id),s.g)}</div><div class="text-[10px] text-center font-bold text-indigo-300">${pwr.toLocaleString()} ATK · ${(pwr*5).toLocaleString()} HP</div></div>`;
}
function arenaUpd(append=false){
  const g=$('#agrid'),mr=$('#arena-more');if(!g)return;
  const dk=validDeck();
  const L=stacks(UInv()).filter(s=>{
    const c=cd(s.id);
    if(S.AF.q&&!c.name.toLowerCase().includes(S.AF.q.toLowerCase()))return false;
    if(S.AF.r&&c.rar!==S.AF.r)return false;
    return true;
  }).sort((a,b)=>cardPwr(b.id,b.g)-cardPwr(a.id,a.g));
  const limitCount=S.AF.n||PAGE_SIZE;
  if(append){
    const prevCount=Math.max(0,limitCount-PAGE_SIZE);
    const chunk=L.slice(prevCount,limitCount);
    if(chunk.length)g.insertAdjacentHTML('beforeend',chunk.map(s=>arenaItemHTML(s,dk)).join(''));
  }else{
    g.innerHTML=L.slice(0,limitCount).map(s=>arenaItemHTML(s,dk)).join('')||'<p class="col-span-full text-xs text-slate-500 py-8 text-center">Aucune carte disponible.</p>';
  }
  if(mr)mr.innerHTML=L.length>limitCount?`<button class="btn2" data-a="moreArena">Afficher plus (${L.length-limitCount} restantes)</button>`:'';
  hydrateCardsDOM(g);
}
A.afq=v=>{S.AF.q=v;S.AF.n=PAGE_SIZE;arenaUpd(false)};
A.afr=v=>{S.AF.r=v;S.AF.n=PAGE_SIZE;arenaUpd(false)};
A.moreArena=()=>{S.AF.n=(S.AF.n||PAGE_SIZE)+PAGE_SIZE;arenaUpd(true)};
A.pickDeck=k=>{
  let dk=validDeck();
  if(dk.includes(k))dk=dk.filter(x=>x!==k);
  else{if(dk.length>=3)return toast('Ton équipe comporte déjà 3 cartes (retire une carte d\'abord)');dk.push(k)}
  S.deck=dk;saveU({arenaDeck:dk}).catch(()=>{});render();
};
A.autoDeck=()=>{
  const top3=stacks(UInv()).sort((a,b)=>cardPwr(b.id,b.g)-cardPwr(a.id,a.g)).slice(0,3).map(keyOf);
  if(top3.length<3)return toast('Il te faut au moins 3 piles de cartes dans ta collection');
  S.deck=top3;saveU({arenaDeck:top3}).catch(()=>{});render();
};

function generateBotOpponent(myElo){
  const oppName=rnd(BOT_NAMES)+' [IA]';
  const oppElo=Math.max(0,myElo+Math.floor(Math.random()*81)-40);
  const base=avail();
  const pickByRar=r=>{
    let c=base.filter(p=>p.rar===r);
    if(!c.length)c=base;
    return rnd(c).id;
  };
  let rarities=[];
  if(myElo<1100){
    const w={C:12,R:58,E:28,L:2,M:0};
    rarities=[roll(w),roll(w),roll(w)];
  }else if(myElo<=1400){
    const w={C:0,R:42,E:45,L:12,M:1};
    rarities=[roll(w),roll(w),roll(w)];
  }else{
    const w={C:0,R:18,E:52,L:26,M:4};
    rarities=[Math.random()<0.88?'L':'M',roll(w),roll(w)];
  }
  const oppCards=rarities.map(r=>{
    const id=pickByRar(r);
    const g=myElo>1400?(Math.random()<0.65?7+Math.floor(Math.random()*3):0):myElo>=1100?(Math.random()<0.45?5+Math.floor(Math.random()*4):0):(Math.random()<0.25?4+Math.floor(Math.random()*4):0);
    return makeUnit(id,g);
  });
  return{oppName,oppElo,oppCards};
}

async function renderCombat(){
  if(!S.combat)return;
  const ids=[...S.combat.myCards.map(u=>u.id),...S.combat.oppCards.map(u=>u.id)];
  await Promise.all(ids.map(id=>getCardDetails(id)));
  if(!S.combat)return;
  modal(vCombat(),1);
}

A.selCombatAtk=idx=>{
  const C=S.combat;if(!C||C.status!=='active')return;
  if(C.turn!==uid)return toast('Ce n\'est pas encore ton tour !');
  const i=+idx,u=C.myCards[i];
  if(!u||u.hp<=0)return;
  C.selAtk=C.selAtk===i?null:i;
  AU.flip();
  renderCombat();
};

A.atkCombatTgt=async idx=>{
  const C=S.combat;if(!C||C.status!=='active'||C.acting)return;
  if(C.turn!==uid)return toast('Patiente, c\'est le tour de ton adversaire !');
  if(C.selAtk===null)return toast('Clique d\'abord sur l\'une de tes cartes en vie en bas !');
  const atkIdx=C.selAtk,tgtIdx=+idx;
  const attacker=C.myCards[atkIdx],target=C.oppCards[tgtIdx];
  if(!attacker||attacker.hp<=0)return toast('Cet attaquant est K.O.');
  if(!target||target.hp<=0)return toast('Cette cible est déjà K.O.');

  C.acting=true;
  AU.hit();
  const dmg=attacker.atk;
  target.hp=Math.max(0,target.hp-dmg);
  const actionLog=`${U().name} : ${cd(attacker.id).name} attaque ${cd(target.id).name} et inflige ${dmg.toLocaleString()} dégâts !${target.hp===0?' (K.O. !)':''}`;
  C.log=actionLog;
  C.selAtk=null;

  const allEnemyKo=C.oppCards.every(c=>c.hp<=0);

  if(C.mode==='bot'){
    if(allEnemyKo){
      C.status='finished';
      C.acting=false;
      await settleCombatRewards(true,'Toutes les cartes adverses sont K.O. !',null);
      return;
    }
    C.turn='bot';
    await renderCombat();
    setTimeout(async()=>{
      const cur=S.combat;
      if(!cur||cur.mode!=='bot'||cur.status!=='active')return;
      const aliveBot=cur.oppCards.map((c,i)=>({c,i})).filter(x=>x.c.hp>0);
      const aliveMe=cur.myCards.map((c,i)=>({c,i})).filter(x=>x.c.hp>0);
      if(!aliveBot.length||!aliveMe.length)return;
      const bPick=rnd(aliveBot),mPick=rnd(aliveMe);
      AU.hit();
      mPick.c.hp=Math.max(0,mPick.c.hp-bPick.c.atk);
      cur.log=`${cur.oppName} : ${cd(bPick.c.id).name} attaque ${cd(mPick.c.id).name} et inflige ${bPick.c.atk.toLocaleString()} dégâts !${mPick.c.hp===0?' (K.O. !)':''}`;
      if(cur.myCards.every(c=>c.hp<=0)){
        cur.status='finished';
        cur.acting=false;
        await settleCombatRewards(false,'Toutes tes cartes ont été mises K.O. !',null);
        return;
      }
      cur.turn=uid;
      cur.acting=false;
      await renderCombat();
    },1250+Math.floor(Math.random()*650));
  }else if(C.mode==='pvp'&&C.battleId){
    try{
      const bRef=doc(db,'battles',C.battleId);
      const oppField=C.mySide==='p1'?'p2.cards':'p1.cards';
      const up={[oppField]:C.oppCards,log:actionLog,ts:Date.now()};
      if(allEnemyKo){
        up.status='finished';
        up.winner=uid;
        up.reason=`${U().name} a mis K.O. toute l'équipe adverse !`;
      }else{
        up.turn=C.oppUid;
      }
      await updateDoc(bRef,up);
    }catch(e){fail(e)}
    C.acting=false;
  }
};

A.forfeitCombat=async()=>{
  const C=S.combat;if(!C||C.status!=='active')return;
  if(!confirm('Abandonner le combat ? Cela comptera comme une défaite et entraînera une perte d\'Elo.'))return;
  C.status='finished';
  if(C.mode==='pvp'&&C.battleId){
    try{
      await updateDoc(doc(db,'battles',C.battleId),{
        status:'finished',
        winner:C.oppUid,
        reason:`${U().name} a capitulé !`,
        log:`${U().name} a fui le combat.`
      });
    }catch(e){}
  }
  await settleCombatRewards(false,'Tu as abandonné le combat.',C.battleId);
};

async function settleCombatRewards(victory,reason,battleId){
  const C=S.combat;
  if(!C||C.settled)return;
  C.settled=true;
  C.status='finished';
  UN.battle?.();delete UN.battle;

  const myElo=U().elo??1000;
  const eloGain=15+Math.floor(Math.random()*11);
  const eloLoss=10+Math.floor(Math.random()*11);
  const deltaElo=victory?eloGain:-eloLoss;
  const newElo=Math.max(0,myElo+deltaElo);
  const acRew=victory?50:5;

  const q=normQuests(U().quests);
  q.d_arena=(q.d_arena||0)+1;
  if(victory)q.w_arenaWin=(q.w_arenaWin||0)+1;

  try{
    await saveU({
      elo:newElo,
      ac:(U().ac||0)+acRew,
      earned:(U().earned||0)+acRew,
      arenaWins:(U().arenaWins||0)+(victory?1:0),
      arenaLosses:(U().arenaLosses||0)+(victory?0:1),
      quests:q
    });
  }catch(e){}

  if(battleId){
    setTimeout(()=>deleteDoc(doc(db,'battles',battleId)).catch(()=>{}),2500);
  }

  if(victory)AU.jingle();else AU.flip();
  const snapC=cl(C);
  S.combat=null;
  S.busy=false;

  modal(`<div class="glass bg-[#111526] p-5 max-w-xl w-full space-y-4 text-xs sm:text-sm border ${victory?'border-emerald-400/50':'border-rose-500/50'}">
    <div class="text-center space-y-1">
      <div class="text-xs font-extrabold uppercase tracking-widest ${victory?'text-emerald-400':'text-rose-400'}">${victory?'VICTOIRE EN ARÈNE':'DÉFAITE EN ARÈNE'}</div>
      <h3 class="text-lg font-extrabold text-white">${E(snapC.myName)} vs ${E(snapC.oppName)}</h3>
      <p class="text-xs text-slate-300">${E(reason||'')}</p>
    </div>
    <div class="grid grid-cols-2 gap-3 text-center">
      <div class="p-3 rounded-xl bg-white/5">
        <div class="text-[10px] text-slate-400 uppercase">Cartes Alliées en vie</div>
        <div class="text-base font-extrabold text-emerald-300 mt-0.5">${snapC.myCards.filter(c=>c.hp>0).length} / 3</div>
      </div>
      <div class="p-3 rounded-xl bg-white/5">
        <div class="text-[10px] text-slate-400 uppercase">Cartes Ennemies en vie</div>
        <div class="text-base font-extrabold text-rose-300 mt-0.5">${snapC.oppCards.filter(c=>c.hp>0).length} / 3</div>
      </div>
    </div>
    <div class="p-3 rounded-xl bg-white/5 flex flex-wrap items-center justify-between gap-2">
      <div>Récompense : <b class="text-amber-300">+${acRew} AC</b></div>
      <div>Classement Elo : <b class="${victory?'text-emerald-400':'text-rose-400'}">${deltaElo>0?'+'+deltaElo:deltaElo} PTS</b> <span class="text-slate-400">(Nouveau : ${newElo} PTS)</span></div>
    </div>
    <button class="btn w-full" data-a="close">Retourner à l'Arène</button>
  </div>`);
  render();
}

function startPvpBattleListener(battleId){
  sub('battle',onSnapshot(doc(db,'battles',battleId),snap=>{
    if(!snap.exists())return;
    const d=snap.data();
    const isP1=d.p1?.uid===uid;
    const me=isP1?d.p1:d.p2,opp=isP1?d.p2:d.p1;
    if(!me||!opp)return;
    if(!S.combat){
      S.combat={
        mode:'pvp',
        battleId,
        mySide:isP1?'p1':'p2',
        myName:me.name||'Moi',
        myElo:me.elo??1000,
        oppUid:opp.uid,
        oppName:opp.name||'Adversaire',
        oppElo:opp.elo??1000,
        myCards:me.cards||[],
        oppCards:opp.cards||[],
        turn:d.turn,
        selAtk:null,
        log:d.log||'Le duel commence !',
        status:d.status||'active',
        settled:false,
        acting:false
      };
    }else{
      S.combat.myCards=me.cards||S.combat.myCards;
      S.combat.oppCards=opp.cards||S.combat.oppCards;
      S.combat.turn=d.turn;
      S.combat.log=d.log||S.combat.log;
      S.combat.status=d.status||S.combat.status;
      if(S.combat.selAtk!==null&&(!S.combat.myCards[S.combat.selAtk]||S.combat.myCards[S.combat.selAtk].hp<=0)){
        S.combat.selAtk=null;
      }
    }
    if(d.status==='finished'&&!S.combat.settled){
      const won=d.winner===uid;
      settleCombatRewards(won,d.reason||(won?'Tu as remporté le duel PvP !':'Ton adversaire a remporté le duel PvP.'),battleId);
      return;
    }
    renderCombat();
  }));
}

A.fightArena=async()=>{
  const dk=validDeck();if(dk.length<3)return toast('Sélectionne 3 cartes pour combattre');
  if(S.busy||S.combat)return;
  S.busy=true;
  const myElo=U().elo??1000;
  const myUnits=dk.map(k=>{const {id,g}=parse(k);return makeUnit(id,g)});
  const qRef=doc(db,'arena_queue',uid);

  modal(`<div class="glass bg-[#111526] p-6 max-w-sm w-full text-center space-y-4 border border-pink-500/40">
    <div class="radar-ring mx-auto"></div>
    <div class="space-y-1">
      <h3 class="text-sm font-extrabold text-white uppercase tracking-wider">Recherche d'un adversaire en cours...</h3>
      <p class="text-xs text-indigo-300">(Temps estimé : <b id="mm-sec">20</b>s)</p>
      <p class="text-[11px] text-slate-400 pt-1">Plage de recherche : ${Math.max(0,myElo-300)} — ${myElo+300} Elo</p>
    </div>
  </div>`,1);

  let matchedBattleId=null;

  try{
    await setDoc(qRef,{uid,name:U().name,elo:myElo,deck:myUnits,ts:Date.now(),matchedBy:null,battleId:null});

    for(let step=20;step>0&&!matchedBattleId;step--){
      const secEl=$('#mm-sec');if(secEl)secEl.textContent=step;
      await sleep(1000);

      const mySnap=await getDoc(qRef);
      if(mySnap.exists()&&mySnap.data().matchedBy&&mySnap.data().battleId){
        matchedBattleId=mySnap.data().battleId;
        break;
      }

      const qs=await getDocs(collection(db,'arena_queue'));
      const now=Date.now();
      const cand=qs.docs.map(d=>({id:d.id,...d.data()})).filter(x=>
        x.id!==uid&&
        x.id<uid&&
        !x.matchedBy&&
        now-(x.ts||0)<60000&&
        Math.abs((x.elo??1000)-myElo)<=300&&
        Array.isArray(x.deck)&&x.deck.length===3
      ).sort((a,b)=>Math.abs((a.elo??1000)-myElo)-Math.abs((b.elo??1000)-myElo))[0];

      if(cand){
        try{
          const bRef=doc(collection(db,'battles'));
          const cRef=doc(db,'arena_queue',cand.id);
          const candUnits=cand.deck.map(c=>c.maxHp?c:makeUnit(c.id,c.g||0));
          await runTransaction(db,async tx=>{
            const cs=await tx.get(cRef);
            if(!cs.exists()||cs.data().matchedBy)throw 'candidat indisponible';
            tx.set(bRef,{
              p1:{uid:cand.id,name:cand.name||'Joueur 1',elo:cand.elo??1000,cards:candUnits},
              p2:{uid,name:U().name||'Joueur 2',elo:myElo,cards:myUnits},
              turn:Math.random()<0.5?cand.id:uid,
              status:'active',
              winner:null,
              reason:'',
              log:'Le duel JcJ commence ! Sélectionne une carte pour attaquer.',
              ts:Date.now()
            });
            tx.update(cRef,{matchedBy:uid,battleId:bRef.id});
          });
          matchedBattleId=bRef.id;
        }catch(e){}
      }
    }

    if(!matchedBattleId){
      const fin=await getDoc(qRef);
      if(fin.exists()&&fin.data().matchedBy&&fin.data().battleId)matchedBattleId=fin.data().battleId;
    }
    await deleteDoc(qRef).catch(()=>{});

    if(matchedBattleId){
      S.busy=false;
      startPvpBattleListener(matchedBattleId);
    }else{
      const bot=generateBotOpponent(myElo);
      S.busy=false;
      S.combat={
        mode:'bot',
        battleId:null,
        mySide:'p1',
        myName:U().name,
        myElo,
        oppUid:'bot',
        oppName:bot.oppName,
        oppElo:bot.oppElo,
        myCards:myUnits,
        oppCards:bot.oppCards,
        turn:uid,
        selAtk:null,
        log:`${bot.oppName} entre dans l'Arène ! C'est à ton tour d'attaquer.`,
        status:'active',
        settled:false,
        acting:false
      };
      await renderCombat();
    }
  }catch(e){
    await deleteDoc(qRef).catch(()=>{});
    S.busy=false;
    closeM();fail(e);
  }
};

async function settle(aid){
  try{
    let info=null;
    await runTransaction(db,async tx=>{
      const ar=doc(db,'auctions',aid),as=await tx.get(ar);
      if(!as.exists())return;
      const a=as.data();
      if(!a||a.status!=='open'||a.end>Date.now())return;
      const sr=doc(db,'users',a.seller),ss=await tx.get(sr);
      let br=null,bs=null;
      if(a.bidder){br=doc(db,'users',a.bidder);bs=await tx.get(br)}
      const finalBidder=a.bidder&&bs?.exists()?a.bidder:null;
      const recipientUid=finalBidder||a.seller;
      const recInvRef=invDoc(recipientUid,a.card);
      const recInvSnap=await tx.get(recInvRef);
      const curItem=recInvSnap.exists()?recInvSnap.data():{q:0,g:[]};
      const nextQ=a.grade?(curItem.q||0):(curItem.q||0)+1;
      const nextG=Array.isArray(curItem.g)?[...curItem.g]:[];
      if(a.grade)nextG.push(a.grade);

      let tax=0,net=0;
      if(finalBidder){
        tax=Math.floor((a.bid||0)*TAX_RATE);
        net=Math.max(1,(a.bid||0)-tax);
        const si=ss.data();
        tx.update(sr,{ac:(si.ac||0)+net,earned:(si.earned||0)+net});
        tx.update(br,{val:(bs.data().val||0)+sellP(a.card,a.grade||0)});
      }else if(ss.exists()){
        tx.update(sr,{val:(ss.data().val||0)+sellP(a.card,a.grade||0)});
      }
      tx.set(recInvRef,{q:nextQ,g:nextG});
      tx.update(ar,{status:'closed',closedAt:Date.now(),tax,net,...(finalBidder?{}:{bidder:null,bidderName:''})});
      info={...a,bidder:finalBidder,tax,net};
    });
    if(info){
      const n=cd(info.card).name;
      if(info.bidder){
        notif(info.bidder,`Tu as remporté ${n} aux enchères pour ${info.bid} AC !`,'col');
        notif(info.seller,`${n} a été vendu ${info.bid} AC à ${info.bidderName} (Net reçu : +${info.net} AC après 5% de taxe anti-inflation : -${info.tax} AC).`,'col');
      }else notif(info.seller,`${n} n'a pas trouvé preneur : la carte t'a été restituée.`,'col');
    }
  }catch(e){}
}
function tick(){

  document.querySelectorAll('[data-end]').forEach(e=>e.textContent=fmt(Math.max(0,(e.dataset.end-now)/1e3)));

}

    const fi=cl(fiOrig),ti=cl(tiOrig);
    let fa=fs.data().ac||0,ta=ts.data().ac||0;
    for(const c of t.offer.cards){if(!subC(fi,c.id,c.g,c.n))throw t.fromName+' ne possède plus ces cartes';addC(ti,c.id,c.g,c.n)}
    for(const c of t.want.cards){if(!subC(ti,c.id,c.g,c.n))throw 'Tu ne possèdes plus ces cartes';addC(fi,c.id,c.g,c.n)}
    const oac=+(t.offer.ac||0),wac=+(t.want.ac||0);
    if(fa<oac||ta<wac)throw 'AnimeCoins insuffisants';
    const oTax=Math.floor(oac*TAX_RATE),wTax=Math.floor(wac*TAX_RATE);
    fa+=(wac-wTax)-oac;
    ta+=(oac-oTax)-wac;

    const batch=writeBatch(db);
    const touchedF=new Set([...(t.offer.cards||[]).map(c=>c.id),...(t.want.cards||[]).map(c=>c.id)]);
    touchedF.forEach(cid=>{
      const fItem=fi[cid],tItem=ti[cid];
      if(!fItem||(!fItem.q&&(!fItem.g||!fItem.g.length)))batch.delete(invDoc(t.from,cid));
      else batch.set(invDoc(t.from,cid),{q:fItem.q||0,g:Array.isArray(fItem.g)?fItem.g:[]});
      if(!tItem||(!tItem.q&&(!tItem.g||!tItem.g.length)))batch.delete(invDoc(t.to,cid));
      else batch.set(invDoc(t.to,cid),{q:tItem.q||0,g:Array.isArray(tItem.g)?tItem.g:[]});
    });
    batch.update(frRef,{ac:fa,val:invVal(fi)});
    batch.update(toRef,{ac:ta,val:invVal(ti)});
    batch.update(tr,{status:'accepted',taxBurned:oTax+wTax});
    await batch.commit();
    S.inv=cl(ti);

    const totTax=oTax+wTax;
    toast('Échange accepté !'+(totTax?` (Taxe marché 5% : -${totTax} AC)`:''));
    notif(t.from,`${t.toName} a accepté ton échange !`+(totTax?` (Taxe marché 5% : -${totTax} AC détruits)`:''),'trade');
  }catch(e){fail(e)}
};

A.leaveC=async()=>{
  const cid=U().clan;if(!cid)return;
  try{
    let newLeader=null,clanName='';
    await runTransaction(db,async tx=>{
      const cr=doc(db,'clans',cid),cs=await tx.get(cr);
      if(cs.exists()){
        const c=cs.data();clanName=c.name||'';
        const rem=(c.members||[]).filter(m=>m!==uid);
        const roles=cl(c.roles||{});delete roles[uid];
        if(c.owner===uid){
          if(rem.length>0){
            const memMap=Object.fromEntries((S.cmem||[]).map(m=>[m.id,m]));
            rem.sort((a,b)=>{
              const oa=roles[a]==='officer'?1:0,ob=roles[b]==='officer'?1:0;
              if(ob!==oa)return ob-oa;
              const ca=memMap[a]?.clanContributed||0,cb=memMap[b]?.clanContributed||0;
              if(cb!==ca)return cb-ca;
              return (memMap[b]?.val||0)-(memMap[a]?.val||0);
            });
            newLeader=rem[0];
            roles[newLeader]='leader';
            tx.update(cr,{owner:newLeader,members:rem,roles});
          }else{
            tx.update(cr,{members:[],roles:{}});
          }
        }else{
          tx.update(cr,{members:rem,roles});
        }
      }
      tx.update(ME(),{clan:null});
    });
    if(newLeader)notif(newLeader,`Succession : tu es désormais le nouveau Chef du clan ${clanName} !`,'clan');
    toast('Tu as quitté le clan.');
  }catch(e){fail(e)}
};

  const clean=[];
  slots.forEach(k=>{if(k&&!clean.includes(k))clean.push(k)});
  await saveU({showcase:clean.slice(0,5)});
  toast('Vitrine de profil mise à jour !');
};
A.pName=v=>{v=v.trim();if(v.length>=3)saveU({name:v,nameL:v.toLowerCase()})};
A.pBio=v=>saveU({bio:v});A.pTitle=v=>saveU({title:v});
A.pAvCard=async id=>{
  if(!id)return saveU({avImg:'',avCard:''});
  const det=await getCardDetails(id);
  await saveU({avImg:det?.img||'',avCard:id});
  toast('Photo de profil mise à jour !');
};
A.pBan=v=>saveU({banner:+v});
A.pSound=(v,el)=>{localStorage.ac_mute=el.checked?'0':'1';if(el.checked)AU.flip()};
A.exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...U(),inventory:UInv()},null,1)],{type:'application/json'}));a.download='animecards-save.json';a.click()};
A.clearCache=async()=>{if(confirm('Vider le cache du catalogue ? Il sera rechargé au prochain démarrage.')){await idbClear();location.reload()}};
A.pNsfw=async(v,el)=>{
  await saveU({nsfw:el.checked});
  if(el.checked&&!POOL.some(p=>p.adult)){
    toast('Chargement du catalogue 18+ en arrière-plan...');
    try{
      for(const j of ADJ){
        const rows=await fetchJob(j);
        await idbPut(rows);
        rows.forEach(r=>BGMAP.set(r.id,toLightCard(r)));
        await sleep(1200);
      }
      refresh();toast('Contenu 18+ activé');
    }catch(e){fail(e)}
  }
};

boot().catch(e=>showErr(e.message||e));
</script>
</body>
