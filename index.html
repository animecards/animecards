<!DOCTYPE html>

<title>AnimeCards</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#090b10;
  --panel:#11141d;
  --panel-hover:#171b26;
  --border:rgba(255,255,255,.08);
  --text:#f1f5f9;
  --muted:#94a3b8;
  --accent:#6366f1;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
.glass{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
}
header.glass{
  background:rgba(9,11,16,.92);
  backdrop-filter:blur(12px);
  border-width:0 0 1px 0;
  border-radius:0;
}
.btn{
  background:#6366f1;
  color:#fff;
  font-weight:600;
  font-size:.85rem;
  padding:.5rem 1rem;
  border-radius:8px;
  transition:all .15s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.4rem;
}
.btn:hover{background:#4f46e5}
.btn:disabled{opacity:.4;pointer-events:none}
.btn2{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.1);
  color:#cbd5e1;
  padding:.4rem .75rem;
  border-radius:8px;
  font-size:.8rem;
  font-weight:500;
  transition:all .15s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.35rem;
}
.btn2:hover{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.22);
  color:#fff;
}
input,select,textarea{
  background:#090b10;
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  padding:.45rem .65rem;
  color:var(--text);
  max-width:100%;
  font-size:.85rem;
  transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#6366f1;
}
.tab{
  padding:.45rem .8rem;
  border-radius:8px;
  white-space:nowrap;
  color:var(--muted);
  font-weight:500;
  font-size:.82rem;
  transition:all .15s;
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  gap:.35rem;
}
.tab:hover{color:#fff;background:rgba(255,255,255,.04)}
.tab.on{background:rgba(99,102,241,.16);color:#fff;border:1px solid rgba(99,102,241,.4)}

/* Cartes & Raretés */
.card{
  position:relative;
  aspect-ratio:2/3;
  border-radius:10px;
  border:2px solid var(--bc,#52525b);
  overflow:hidden;
  cursor:pointer;
  background:#141720;
  transform:perspective(800px) rotateX(var(--rx,0)) rotateY(var(--ry,0));
  transition:transform .15s ease,box-shadow .2s ease;
  user-select:none;
}
.art{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg,hsl(var(--hue),22%,20%),#0e1017);
}
.art b{font-size:3rem;opacity:.25;font-weight:700}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nm{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:.55rem .55rem .45rem;
  background:linear-gradient(transparent,rgba(5,7,12,.92) 45%,#05070c);
  font-size:.72rem;
  font-weight:600;
  line-height:1.15;
}
.nm small{
  display:block;
  font-weight:500;
  color:#cbd5e1;
  opacity:.85;
  font-size:.62rem;
  margin-top:2px;
}
.nm .cdesc{
  display:-webkit-box;
  -webkit-line-clamp:1;
  -webkit-box-orient:vertical;
  overflow:hidden;
  font-size:.55rem;
  color:#94a3b8;
  font-weight:400;
  margin-top:2px;
}
.rl{
  position:absolute;
  top:5px;
  left:5px;
  font-size:.56rem;
  padding:1px 6px;
  border-radius:99px;
  background:rgba(9,11,16,.85);
  border:1px solid rgba(255,255,255,.1);
  color:var(--bc);
  font-weight:700;
  z-index:3;
}
.tp{
  position:absolute;
  top:23px;
  left:5px;
  font-size:.5rem;
  padding:1px 5px;
  border-radius:4px;
  background:rgba(9,11,16,.85);
  color:#cbd5e1;
  font-weight:600;
  letter-spacing:.03em;
  z-index:3;
}
.tp.f{color:#a5b4fc}
.cnt{
  position:absolute;
  top:6px;
  right:6px;
  z-index:6;
  background:#090b10;
  color:#fff;
  font-weight:700;
  font-size:.72rem;
  border:1px solid rgba(255,255,255,.22);
  border-radius:6px;
  padding:1px 6px;
}
.shine{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 48%,transparent 65%);
  background-size:250% 100%;
  background-position:var(--mx,50%) 0;
  mix-blend-mode:overlay;
  transition:opacity .2s;
  z-index:2;
}
.tilt:hover .shine{opacity:.55}
.r-C{--bc:#71717a}
.r-R{--bc:#3b82f6}
.r-E{--bc:#a855f7;box-shadow:0 0 12px rgba(168,85,247,.18)}
.r-L{--bc:#eab308;box-shadow:0 0 16px rgba(234,179,8,.28)}
.r-L .shine{opacity:.35}
.r-M{
  --bc:#f472b6;
  border-color:transparent;
  box-shadow:0 0 20px rgba(236,72,153,.35);
  background:linear-gradient(#141720,#141720) padding-box,linear-gradient(125deg,#f472b6,#60a5fa,#facc15,#34d399,#a78bfa,#f472b6) border-box;
}
.r-M .shine{
  background:linear-gradient(115deg,#f472b6,#60a5fa,#facc15,#34d399,#a78bfa,#f472b6);
  background-size:300%;
  mix-blend-mode:color-dodge;
  opacity:.45;
}
.back{
  background:radial-gradient(circle at 50% 50%,#1e2436 0%,#0d1017 100%);
  border-color:#334155;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2.2rem;
  color:#94a3b8;
}
.slab{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.16);
  border-radius:10px;
  padding:5px;
}
.slab .lab{
  display:flex;
  justify-content:space-between;
  background:#f1f5f9;
  color:#090b10;
  border-radius:4px;
  padding:2px 6px;
  font-size:.6rem;
  margin-bottom:4px;
  font-weight:700;
}
.sel{outline:2px solid #6366f1;outline-offset:2px;border-radius:12px}

/* Design Booster Pack Sobre & Métallisé */
.pack{
  position:relative;
  width:220px;
  height:340px;
  margin:auto;
  border-radius:6px;
  background:linear-gradient(135deg,#161b2e 0%,#0b0e18 45%,#121726 75%,#080a11 100%);
  border:1px solid rgba(192,206,238,.25);
  box-shadow:0 22px 48px rgba(0,0,0,.85),inset 0 0 24px rgba(139,92,246,.08);
  cursor:pointer;
  transition:transform .35s cubic-bezier(.2,1,.3,1),box-shadow .35s ease,opacity .45s ease;
  overflow:hidden;
  user-select:none;
}
.pack::before,.pack::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:16px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0,rgba(255,255,255,.12) 2px,rgba(0,0,0,.45) 2px,rgba(0,0,0,.45) 5px),
    linear-gradient(180deg,#252d44,#0d111c);
  z-index:4;
}
.pack::before{top:0;border-bottom:1px solid rgba(255,255,255,.18)}
.pack::after{bottom:0;border-top:1px solid rgba(255,255,255,.18)}
.pack:hover{
  transform:translateY(-6px) scale(1.015);
  border-color:rgba(196,181,253,.5);
  box-shadow:0 28px 60px rgba(0,0,0,.92),0 0 28px rgba(139,92,246,.2);
}
.pack-foil{
  position:absolute;
  inset:0;
  background:linear-gradient(115deg,transparent 25%,rgba(196,181,253,.14) 45%,rgba(103,232,249,.12) 52%,transparent 70%);
  background-size:250% 100%;
  transition:background-position .6s ease;
  pointer-events:none;
  z-index:3;
}
.pack:hover .pack-foil{background-position:100% 0}
.pack.torn{
  transform:translateY(-32px) rotate(5deg) scale(1.1);
  opacity:0;
}

/* Animations d'ouverture & Rareté L/M */
@keyframes fl{from{opacity:0;transform:rotateY(85deg) scale(.88)}to{opacity:1;transform:rotateY(0) scale(1)}}
@keyframes fR{50%{box-shadow:0 0 28px 4px rgba(59,130,246,.45)}}
@keyframes fE{50%{box-shadow:0 0 42px 8px rgba(168,85,247,.5)}}
@keyframes fL{0%,100%{box-shadow:0 0 35px 6px rgba(234,179,8,.5)}50%{box-shadow:0 0 95px 28px rgba(250,204,21,.85)}}
@keyframes fM{
  0%{box-shadow:0 0 60px 18px rgba(244,114,182,.75)}
  33%{box-shadow:0 0 95px 30px rgba(96,165,250,.85)}
  66%{box-shadow:0 0 95px 30px rgba(250,204,21,.85)}
  100%{box-shadow:0 0 60px 18px rgba(52,211,153,.75)}
}
@keyframes shk{
  15%{transform:translate(-8px,5px) rotate(-1deg)}
  30%{transform:translate(8px,-5px) rotate(1deg)}
  45%{transform:translate(-6px,-4px)}
  60%{transform:translate(6px,4px)}
  75%{transform:translate(-3px,2px)}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flashScreen{0%{opacity:.85}100%{opacity:0}}
@keyframes partOut{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}
.fx-C{animation:fl .32s ease-out}
.fx-R{animation:fl .38s ease-out,fR 1s}
.fx-E{animation:fl .45s ease-out,fE 1.2s}
.fx-L{animation:fl .55s ease-out,fL 1.8s infinite}
.fx-M{animation:fl .65s ease-out,fM 2.2s infinite}
.shake{animation:shk .55s ease-in-out}
.halo-L{
  position:absolute;
  inset:-28%;
  background:conic-gradient(from 0deg,transparent,rgba(250,204,21,.45),transparent,rgba(245,158,11,.45),transparent);
  filter:blur(32px);
  animation:spin 4s linear infinite;
  pointer-events:none;
  z-index:0;
}
.halo-M{
  position:absolute;
  inset:-32%;
  background:conic-gradient(#f472b6,#60a5fa,#facc15,#34d399,#a78bfa,#f472b6);
  filter:blur(36px);
  opacity:.65;
  animation:spin 3s linear infinite;
  pointer-events:none;
  z-index:0;
}
.screen-flash{
  position:fixed;
  inset:0;
  z-index:90;
  pointer-events:none;
  animation:flashScreen .85s ease-out forwards;
}
.ptc{
  position:absolute;
  left:50%;
  top:50%;
  width:7px;
  height:7px;
  border-radius:99px;
  pointer-events:none;
  z-index:20;
  animation:partOut .95s cubic-bezier(.16,1,.3,1) forwards;
}
.scan{
  position:absolute;
  left:0;
  right:0;
  height:2px;
  background:#818cf8;
  box-shadow:0 0 12px #818cf8;
  animation:sc 1s ease-in-out infinite alternate;
  z-index:5;
}
@keyframes sc{from{top:0}to{top:100%}}
.stats p{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.06);
  padding:.42rem 0;
}
</style>

<script type="module">
/* ============ 1. CONFIGURATION FIREBASE & INITIALISATION ============ */

/* URL optionnelle si tu héberges ton fichier image de pack à côté d'index.html */
const PACK_IMG_URL = "";

let initializeApp,getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,
    getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,where,orderBy,limit,onSnapshot,runTransaction,arrayUnion,arrayRemove,documentId,getDocs,writeBatch;

const showErr=m=>{

/* ============ 2. RARETÉS, PROBABILITÉS CACHÉES & CONSTANTES ============ */
const R={
  C:{n:'Commune',w:72,v:10,c:'#94a3b8'},
  R:{n:'Rare',w:20,v:45,c:'#3b82f6'},

};
const RO=['C','R','E','L','M'];
const GN=['','Poor','Fair','Good','VG','VG-EX','EX','EX-MT','NM','Mint','Gem Mint'];
const GW=[0,6,8,12,14,16,16,12,8,5,3];
const gm=g=>g>=10?15:g===9?5:g===8?2.2:g>=7?1.6:g>=5?1:.7;

const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.random()*a.length|0];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cl=o=>JSON.parse(JSON.stringify(o));
const hue=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const fmt=s=>{
  s=Math.max(0,Math.floor(s));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return h>0?`${h}h ${String(m).padStart(2,'0')}m`:`${m}:${String(sec).padStart(2,'0')}`;
};

const A={};
let db,auth,uid=null,POOL=[],PM=new Map(),bgLoading=false;
const S={
  u:null,tab:'packs',socTab:'friends',notifs:[],auc:[],allAuc:[],trIn:[],trOut:[],
  fr:{},clan:null,cmem:[],clans:[],chat:[],
  F:{q:'',r:'',g:'',d:false,a:'',n:60},

};

/* ============ 3. INDEXEDDB & CATALOGUE 5 000 CARTES (LAZY LOADING) ============ */
const idb=()=>new Promise((res,rej)=>{
  const r=indexedDB.open('animecards',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
});
const idbAll=async()=>{
  try{
    const d=await idb();
    return await new Promise((r,j)=>{
      const q=d.transaction('cards').objectStore('cards').getAll();
      q.onsuccess=()=>r(q.result||[]);
      q.onerror=()=>j();
    });
  }catch(e){return []}
};
const idbPut=async a=>{
  try{
    const d=await idb();
    return await new Promise(r=>{
      const t=d.transaction('cards','readwrite'),s=t.objectStore('cards');
      a.forEach(x=>s.put(x));
      t.oncomplete=r;
      t.onerror=r;
    });
  }catch(e){}
};

function cleanDesc(raw,kind){
  if(!raw)return kind==='c'?'Personnage emblématique issu du catalogue AniList.':'Œuvre majeure référencée dans le catalogue AniList.';
  let s=String(raw)
    .replace(/~!([\s\S]*?)!~/g,'')
    .replace(/<[^>]+>/g,' ')
    .replace(/__(.*?)__/g,'$1')
    .replace(/\*\*(.*?)\*\*/g,'$1')
    .replace(/\[([^\]]+)\]\([^\)]+\)/g,'$1')
    .replace(/&(quot|amp|lt|gt|#039|rsquo|lsquo|ldquo|rdquo|ndash|mdash);/g,' ')
    .replace(/\s+/g,' ')
    .trim();
  if(!s)return kind==='c'?'Personnage emblématique issu du catalogue AniList.':'Œuvre majeure référencée dans le catalogue AniList.';
  return s.length>110?s.slice(0,108).trim()+'…':s;
}

async function gql(q,v){
  for(let i=0;i<5;i++){
    const r=await fetch('https://graphql.anilist.co',{
      method:'POST',
      headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({query:q,variables:v})
    });
    if(r.status===429){
      const wait=(+r.headers.get('retry-after')||15)*1000+1000;
      await sleep(wait);
      continue;
    }
    if(!r.ok)throw new Error('AniList HTTP '+r.status);
    return (await r.json()).data.Page;
  }
  throw new Error('Limite de requêtes AniList atteinte');
}

const QC='query($p:Int){Page(page:$p,perPage:50){characters(sort:FAVOURITES_DESC){id name{full} image{large} favourites description(asHtml:false)}}}';
const QM='query($p:Int,$t:MediaType,$a:Boolean){Page(page:$p,perPage:50){media(type:$t,sort:FAVOURITES_DESC,isAdult:$a){id title{romaji english} coverImage{extraLarge} favourites description(asHtml:false)}}}';

async function fetchJob(job){
  const [k,p,a]=[job[0],+job.slice(1).replace('x',''),job.endsWith('x')];
  if(k==='c'){
    const d=await gql(QC,{p});
    return (d.characters||[]).map(x=>({
      id:'c'+x.id,kind:'c',name:x.name.full,img:x.image?.large||'',
      fav:x.favourites||0,desc:cleanDesc(x.description,'c'),job,adult:false
    }));
  }
  const d=await gql(QM,{p,t:k==='a'?'ANIME':'MANGA',a});
  return (d.media||[]).map(x=>({
    id:k+x.id,kind:k,name:x.title.english||x.title.romaji,img:x.coverImage?.extraLarge||'',
    fav:x.favourites||0,desc:cleanDesc(x.description,k),job,adult:a
  }));
}

function assignPyramid(list){
  list.sort((a,b)=>(b.fav||0)-(a.fav||0));
  const n=list.length||1;
  list.forEach((x,i)=>{
    const q=i/n;
    x.rar=q<.005?'M':q<.03?'L':q<.13?'E':q<.40?'R':'C';
    if(!x.desc)x.desc=cleanDesc('',x.kind);
  });
}
function rarify(all){
  assignPyramid(all.filter(x=>x.kind==='c'&&!x.adult));
  assignPyramid(all.filter(x=>x.kind!=='c'&&!x.adult));
  assignPyramid(all.filter(x=>x.adult));
}
const reg=all=>{
  POOL=all.filter(x=>x.rar);
  PM=new Map(POOL.map(x=>[x.id,x]));
};

const JOBS=[];
for(let i=1;i<=20;i++){
  JOBS.push('c'+((i-1)*3+1),'c'+((i-1)*3+2),'c'+((i-1)*3+3),'a'+i,'n'+i);
}
const ADJ=['a1x','a2x'];

function updateBgBadge(){
  const el=$('#bg-loader');
  if(!el)return;
  if(bgLoading&&POOL.length<5000){
    el.classList.remove('hidden');
    el.textContent=`Catalogue : ${POOL.length.toLocaleString()} / 5 000`;
  }else{
    el.classList.add('hidden');
  }
}

async function startBackgroundLazyLoader(all){
  if(bgLoading)return;
  bgLoading=true;
  const map=new Map(all.map(x=>[x.id,x]));
  const done=new Set(all.map(x=>x.job));
  const todo=JOBS.filter(j=>!done.has(j));
  updateBgBadge();
  for(let i=0;i<todo.length;i++){
    try{
      const rows=await fetchJob(todo[i]);
      rows.forEach(r=>map.set(r.id,r));
      const cur=[...map.values()];
      rarify(cur);
      reg(cur);
      await idbPut(rows);
      updateBgBadge();
      if(S.tab==='codex'&&!document.activeElement?.matches?.('input,select'))fillCodex();
    }catch(e){
      await sleep(3000);
    }
    await sleep(1400);
  }
  const finalAll=[...map.values()];
  rarify(finalAll);
  reg(finalAll);
  await idbPut(finalAll);
  bgLoading=false;
  updateBgBadge();
}

/* ============ 4. LOGIQUE DES CARTES, AVATARS & INVENTAIRE ============ */
const cd=id=>PM.get(id)||{id,name:'Carte #'+id,img:'',rar:'C',kind:'c',fav:0,desc:'Carte du catalogue AnimeCards.'};
const val=(id,g)=>Math.round(R[cd(id).rar].v*(g?gm(g):1));
const sellP=(id,g)=>Math.max(1,Math.round(val(id,g)*.3));

/* La valeur affichée sur la carte correspond exactement au prix de revente directe au jeu (sellP) */
function card(c,g=0){
  const d=c.desc||cleanDesc('',c.kind);
  return `<div class="card tilt r-${c.rar}" style="--hue:${hue(c.id)}" title="${E(c.name)} — ${E(d)}">
    <div class="art"><b>${E(c.name?.[0]||'?')}</b>${c.img?`<img src="${E(c.img)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">`:''}</div>
    <div class="shine"></div>
    <span class="rl">${R[c.rar].n}</span>
    <span class="tp ${c.kind==='c'?'':'f'}">${c.kind==='c'?'PERSONNAGE':'FRANCHISE'}</span>
    <div class="nm">
      <div class="truncate">${E(c.name)}</div>
      <div class="cdesc">${E(d)}</div>
      <small>${sellP(c.id,g).toLocaleString()} AC</small>
    </div>
  </div>`;
}
const slab=(c,g=0)=>g?`<div class="slab"><div class="lab"><span>PSA · ANIMECARDS</span><b>${g} ${GN[g]}</b></div>${card(c,g)}</div>`:card(c,0);
const tile=(s,act,sel)=>`<div class="relative ${sel?'sel':''}" data-a="${act}" data-p="${s.id}|${s.g}">${s.n>1?`<span class="cnt">x${s.n}</span>`:''}${slab(cd(s.id),s.g)}</div>`;

const cnt=(inv,id,g)=>g?(inv?.[id]?.g||[]).filter(x=>x===g).length:(inv?.[id]?.q||0);
const cntTotal=(inv,id)=>(inv?.[id]?.q||0)+((inv?.[id]?.g||[]).length);
const addC=(inv,id,g,n=1)=>{
  const o=inv[id]||(inv[id]={q:0,g:[]});
  if(!Array.isArray(o.g))o.g=[];
  if(typeof o.q!=='number')o.q=0;
  if(g)for(let i=0;i<n;i++)o.g.push(g);
  else o.q+=n;
};
const subC=(inv,id,g,n=1)=>{
  const o=inv?.[id];
  if(!o||cnt(inv,id,g)<n)return false;
  if(g){for(let i=0;i<n;i++)o.g.splice(o.g.indexOf(g),1)}
  else o.q-=n;
  if(!o.q&&(!o.g||!o.g.length))delete inv[id];
  return true;
};
const stacks=inv=>{
  const r=[];
  for(const id in inv||{}){
    if(inv[id]?.q)r.push({id,g:0,n:inv[id].q});
    const m={};
    (inv[id]?.g||[]).forEach(x=>m[x]=(m[x]||0)+1);
    for(const g in m)r.push({id,g:+g,n:m[g]});
  }
  return r;
};
const invVal=inv=>stacks(inv).reduce((a,s)=>a+sellP(s.id,s.g)*s.n,0);

const U=()=>S.u||{};

const saveU=p=>updateDoc(ME(),p);

function start(){
  sub('u',onSnapshot(ME(),s=>{
    if(!s.exists())return;
    const first=!S.u;
    S.u=s.data();
    head();
    soft();
    if(first||S.frKey!==(S.u.friends||[]).join())subFriends();
    if(first||S.cid!==S.u.clan)subClan();
  }));
  sub('n',onSnapshot(query(collection(db,'users',uid,'notifs'),orderBy('ts','desc'),limit(30)),s=>{
    S.notifs=s.docs.map(d=>({id:d.id,...d.data()}));
    head();
  }));
  let firstA=true;
  sub('a',onSnapshot(collection(db,'auctions'),s=>{
    const all=s.docs.map(d=>({id:d.id,...d.data()}));
    S.allAuc=all;
    S.auc=all.filter(a=>a.status==='open');
    if(!firstA){
      s.docChanges().forEach(ch=>{
        const a=ch.doc.data();
        if(ch.type==='added'&&a.status==='open'&&a.seller!==uid&&(U().wish||[]).includes(a.card)){
          notif(uid,`❤️ Wishlist : ${cd(a.card).name} est aux enchères (par ${a.sellerName}) !`);
        }
      });
    }
    firstA=false;
    if(S.tab==='auc')soft();
  }));
  sub('tin',onSnapshot(query(collection(db,'trades'),where('to','==',uid)),s=>{
    S.trIn=s.docs.map(d=>({id:d.id,...d.data()}));
    if(S.tab==='trade')soft();
  }));
  sub('tout',onSnapshot(query(collection(db,'trades'),where('from','==',uid)),s=>{
    S.trOut=s.docs.map(d=>({id:d.id,...d.data()}));
    if(S.tab==='trade')soft();
  }));
  sub('clans',onSnapshot(query(collection(db,'clans'),limit(50)),s=>{
    S.clans=s.docs.map(d=>({id:d.id,...d.data()}));
    if(S.tab==='soc')soft();
  }));
  sub('hb',(()=>{const i=setInterval(()=>saveU({seen:Date.now()}).catch(()=>{}),60000);return()=>clearInterval(i)})());
  saveU({seen:Date.now()}).catch(()=>{});
  sub('tick',(()=>{const i=setInterval(tick,1000);return()=>clearInterval(i)})());
}

function subFriends(){
  const f=(U().friends||[]);
  S.frKey=f.join();

  sub('fr',onSnapshot(query(collection(db,'users'),where(documentId(),'in',f.slice(0,30))),s=>{
    S.fr=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));
    if(['soc','trade'].includes(S.tab))soft();
  }));
}

function subClan(){
  const c=S.cid=U().clan;
  if(!c){S.clan=null;S.cmem=[];S.chat=[];sub('cl',()=>{});sub('cm',()=>{});sub('cc',()=>{});return soft()}

    S.clan=s.exists()?{id:s.id,...s.data()}:null;
    if(S.tab==='soc')soft();
  }));
  sub('cm',onSnapshot(query(collection(db,'users'),where('clan','==',c)),s=>{
    S.cmem=s.docs.map(d=>({id:d.id,...d.data()}));

A.openPack=async()=>{
  if(S.P)return;
  const {p,l}=curPacks();
  if(p<1)return toast('Aucun booster disponible pour le moment');
  const cs=[...Array(5)].map(draw).sort((a,b)=>RO.indexOf(cd(a).rar)-RO.indexOf(cd(b).rar));
  const inv=cl(U().inv||{});
  const ownedBefore=cs.map(id=>{
    const before=cntTotal(inv,id);
    addC(inv,id,0,1);
    return before;
  });
  S.P={cs,ownedBefore,i:0,tear:0,flip:0};
  pov();
  try{
    await saveInv(inv,{packs:p-1,last:l,opened:(U().opened||0)+1});
    if(U().clan){
      const hiCount=cs.filter(id=>['L','M'].includes(cd(id).rar)).length;
      const clRef=doc(db,'clans',U().clan);
      runTransaction(db,async tx=>{
        const csDoc=await tx.get(clRef);
        if(!csDoc.exists())return;
        const q=cl(csDoc.data().quests||{packs:0,coins:0,rares:0});
        q.packs=(q.packs||0)+1;
        q.rares=(q.rares||0)+hiCount;
        tx.update(clRef,{quests:q});
      }).catch(()=>{});
    }
  }catch(e){
    S.P=null;
    closeM();
    fail(e);
  }
};

function spawnParticles(rar){
  const colors=rar==='M'?['#f472b6','#60a5fa','#facc15','#34d399','#a78bfa']:['#facc15','#f59e0b','#fde047','#ffffff'];
  let html='';
  for(let i=0;i<28;i++){
    const ang=(Math.PI*2*i)/28+(Math.random()*.3);
    const dist=95+Math.random()*95;
    const tx=Math.round(Math.cos(ang)*dist)+'px';
    const ty=Math.round(Math.sin(ang)*dist)+'px';
    const col=colors[i%colors.length];
    html+=`<span class="ptc" style="background:${col};box-shadow:0 0 8px ${col};--tx:${tx};--ty:${ty}"></span>`;
  }
  return html;
}

function pov(){
  const P=S.P;
  if(!P.tear){
    return modal(`<div class="text-center space-y-3"><div class="pack" id="pk1" data-a="tear">${boosterVisualHTML('CLIQUE POUR DÉCHIRER')}</div><p class="text-xs text-slate-400">Clique sur le booster pour l'ouvrir</p></div>`,1);
  }
  const id=P.cs[P.i],c=cd(id),prev=P.ownedBefore[P.i];
  const isL=c.rar==='L',isM=c.rar==='M',hi=isL||isM;
  const flash=P.flip&&hi?`<div class="screen-flash" style="background:${isM?'radial-gradient(circle,rgba(244,114,182,.55),rgba(96,165,250,.45),transparent 75%)':'radial-gradient(circle,rgba(250,204,21,.55),transparent 75%)'}"></div>`:'';
  const badge=P.flip
    ?(prev===0
      ?`<div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 mb-2">✨ NOUVELLE CARTE</div>`
      :`<div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/15 text-amber-300 border border-amber-400/30 mb-2">Déjà possédée (x${prev})</div>`)
    :`<div class="h-6 mb-2"></div>`;
  const banner=P.flip&&hi
    ?`<div class="mb-2 text-xs font-extrabold tracking-widest uppercase ${isM?'text-pink-400':'text-amber-300'} animate-pulse">⚡ TIRAGE EXCEPTIONNEL · ${R[c.rar].n.toUpperCase()} !</div>`
    :'';

  modal(`${flash}<div class="text-center w-60 sm:w-64 ${P.flip&&hi?'shake':''}">
    ${banner}
    ${badge}
    <div class="relative" data-a="nextC">
      ${P.flip&&isL?'<div class="halo-L"></div>':''}
      ${P.flip&&isM?'<div class="halo-M"></div>':''}
      ${P.flip&&hi?spawnParticles(c.rar):''}
      ${P.flip?`<div class="relative z-10 fx-${c.rar}">${card(c)}</div>`:'<div class="card back">✦</div>'}
    </div>
    <p class="mt-4 text-xs text-slate-400">${P.i+1}/5 — ${P.flip?(P.i<4?'Clique pour la carte suivante':'Clique pour terminer'):'Clique sur la carte pour la révéler'}</p>
  </div>`,1);
}

A.tear=()=>{
  $('#pk1')?.classList.add('torn');
  setTimeout(()=>{S.P.tear=1;pov()},480);
};
A.nextC=()=>{
  const P=S.P;
  if(!P.flip){P.flip=1;return pov()}

  S.P=null;
  closeM();
  render();
};

/* Calcul de la valeur moyenne réelle sur le marché (enchères en cours et ventes terminées) par gradation */
function getCardMarketStats(id){
  const list=(S.allAuc||[]).filter(a=>a.card===id&&(a.status==='open'||a.bidder));
  const byGrade={};
  list.forEach(a=>{
    const gr=+(a.grade||0);
    if(!byGrade[gr])byGrade[gr]=[];
    byGrade[gr].push(+(a.bid||0));
  });
  const avgByGrade={};
  for(const gr in byGrade){
    const arr=byGrade[gr];
    avgByGrade[gr]={
      avg:Math.round(arr.reduce((s,v)=>s+v,0)/arr.length),
      count:arr.length
    };
  }
  return {totalCount:list.length,avgByGrade};
}

function gradeListFiltered(){
  const GF=S.GF;
  return stacks(U().inv).filter(s=>{
    if(s.g)return false;
    const c=cd(s.id);
    if(GF.q&&!c.name.toLowerCase().includes(GF.q.toLowerCase()))return false;
    if(GF.r&&c.rar!==GF.r)return false;
    return true;
  }).sort((a,b)=>{
    if(GF.s==='qty')return b.n-a.n||sellP(b.id,0)-sellP(a.id,0);
    if(GF.s==='name')return cd(a.id).name.localeCompare(cd(b.id).name);
    return sellP(b.id,0)-sellP(a.id,0);
  });
}

A.bid=async aid=>{
  const v=+$('#b'+aid).value;
  let prev=null,nm='';
  try{
    await runTransaction(db,async tx=>{
      const ar=doc(db,'auctions',aid),a=(await tx.get(ar)).data();
      if(!a||a.status!=='open'||a.end<=Date.now())throw 'Enchère terminée';
      if(a.seller===uid)throw 'Impossible de miser sur ta propre vente';
      if((v<=a.bid&&a.bidder)||v<a.bid)throw 'Mise trop basse';
      const mr=ME(),ms=await tx.get(mr);
      let ac=ms.data().ac,pr,ps;
      if(a.bidder&&a.bidder!==uid){pr=doc(db,'users',a.bidder);ps=await tx.get(pr)}
      if(a.bidder===uid)ac+=a.bid;
      if(ac<v)throw 'AnimeCoins insuffisants';
      tx.update(mr,{ac:ac-v});
      if(ps)tx.update(pr,{ac:(ps.data().ac||0)+a.bid});
      tx.update(ar,{bid:v,bidder:uid,bidderName:U().name});
      prev=ps?a.bidder:null;
      nm=cd(a.card).name;
    });
    toast('Mise placée avec succès !');
    if(prev)notif(prev,`⚠️ ${U().name} a surenchéri sur ${nm} (${v} AC) — ta mise t'a été remboursée.`);
  }catch(e){fail(e)}
};

A.listIt=async()=>{

async function settle(aid){
  try{
    let info;
    await runTransaction(db,async tx=>{
      const ar=doc(db,'auctions',aid),a=(await tx.get(ar)).data();
      info=null;
      if(!a||a.status!=='open'||a.end>Date.now())return;
      const sr=doc(db,'users',a.seller),ss=await tx.get(sr);
      let br,bs;
      if(a.bidder){br=doc(db,'users',a.bidder);bs=await tx.get(br)}
      if(a.bidder&&bs?.exists()){
        const si=ss.data();
        tx.update(sr,{ac:(si.ac||0)+a.bid,earned:(si.earned||0)+a.bid});
        const inv=cl(bs.data().inv||{});
        addC(inv,a.card,a.grade);
        tx.update(br,{inv,val:invVal(inv)});
      }else{
        const inv=cl(ss.data().inv||{});
        addC(inv,a.card,a.grade);
        tx.update(sr,{inv,val:invVal(inv)});
      }
      tx.update(ar,{status:'closed'});
      info=a;
    });
    if(info){
      const n=cd(info.card).name;
      if(info.bidder){
        notif(info.bidder,`🏆 Tu as remporté ${n} aux enchères pour ${info.bid} AC !`);
        notif(info.seller,`💰 ${n} a été vendu ${info.bid} AC à ${info.bidderName} !`);
      }else{
        notif(info.seller,`⏱ ${n} n'a pas trouvé preneur : la carte t'a été restituée.`);
      }
    }
  }catch(e){}
}

function tick(){
  const now=Date.now();
  const cd2=$('#cd');
  if(cd2&&S.u){
    const {p,l,iv}=curPacks();
    cd2.textContent=p>=10?'— (stock plein)':fmt((iv-(now-l))/1e3);
    const pk=$('#pk');if(pk)pk.textContent=p;
  }
  document.querySelectorAll('[data-end]').forEach(e=>e.textContent=fmt(Math.max(0,(e.dataset.end-now)/1e3)));
  if(now-(tick.s||0)>5000){
    tick.s=now;
    S.auc.filter(a=>a.end<=now).forEach(a=>settle(a.id));
  }
}

A.tSel=async v=>{
  if(!v){S.T={to:'',toName:'',my:{},th:{},mac:0,tac:0,tinv:null};return render()}

  if(!s.exists())return toast('Joueur introuvable');

A.tTog=p=>{
  const pts=p.split('|');
  const side=pts[0],k=pts[1]+'|'+pts[2],m=+pts[3];

  S.T[side][k]=cur+1>m?0:cur+1;
  render();

A.tSend=async()=>{
  const t=S.T,o=sel2list(t.my),w=sel2list(t.th);
  if(!o.length&&!t.mac&&!w.length&&!t.tac)return toast('La proposition est vide');
  if(t.mac>(U().ac||0))return toast('AnimeCoins insuffisants');
  await addDoc(collection(db,'trades'),{
    from:uid,fromName:U().name,to:t.to,toName:t.toName,
    offer:{cards:o,ac:t.mac},want:{cards:w,ac:t.tac},status:'pending',ts:Date.now()
  });
  notif(t.to,`🤝 ${U().name} t'a envoyé une proposition d'échange`);
  S.T={to:'',toName:'',my:{},th:{},mac:0,tac:0,tinv:null};

A.tAcc=async id=>{
  let tt;
  try{
    await runTransaction(db,async tx=>{
      const tr=doc(db,'trades',id),t=(await tx.get(tr)).data();
      if(!t||t.status!=='pending')throw 'Échange déjà traité';
      if(t.to!==uid)throw 'Non autorisé';
      const fr=doc(db,'users',t.from),to=doc(db,'users',t.to),fs=await tx.get(fr),ts=await tx.get(to);
      const fi=cl(fs.data().inv||{}),ti=cl(ts.data().inv||{});
      let fa=fs.data().ac||0,ta=ts.data().ac||0;
      for(const c of t.offer.cards){if(!subC(fi,c.id,c.g,c.n))throw t.fromName+' ne possède plus ces cartes';addC(ti,c.id,c.g,c.n)}
      for(const c of t.want.cards){if(!subC(ti,c.id,c.g,c.n))throw 'Tu ne possèdes plus ces cartes';addC(fi,c.id,c.g,c.n)}
      fa+=t.want.ac-t.offer.ac;
      ta+=t.offer.ac-t.want.ac;
      if(fa<0||ta<0)throw 'AnimeCoins insuffisants';
      tx.update(fr,{inv:fi,ac:fa,val:invVal(fi)});
      tx.update(to,{inv:ti,ac:ta,val:invVal(ti)});
      tx.update(tr,{status:'accepted'});
      tt=t;
    });
    toast('Échange accepté !');
    notif(tt.from,`✅ ${tt.toName} a accepté ton échange !`);
  }catch(e){fail(e)}
};

        <h4 class="font-bold text-sm text-white">✨ Bonus Passifs Actifs (Niv. ${lvl})</h4>
        <div class="space-y-1.5 text-xs">
          <div class="p-2 rounded bg-white/5 flex justify-between">
            <span class="text-slate-300">⏱ Régénération des boosters :</span>

    <div class="grid md:grid-cols-2 gap-4">

            const rRole=c.owner===r.id?'Chef':(roles[r.id]==='officer'?'Officier':'Membre');

            return `<div class="flex items-center justify-between gap-2 p-2 rounded bg-white/[0.03] border border-white/5">
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-slate-500 font-bold w-4">${i+1}.</span>
                ${avatarHTML(r,'w-7 h-7 text-xs')}
                <div class="min-w-0">
                  <div class="font-semibold text-white truncate">${E(r.name)} ${online(r)?'🟢':''} <span class="px-1.5 py-0.5 rounded text-[10px] ${badgeCol}">${rRole}</span></div>
                  <div class="text-[10px] text-slate-400">Dons coffre : ${(r.clanContributed||0).toLocaleString()} AC</div>

A.clanQ=v=>{S.CLQ=v;render()};
A.pickCIcon=ic=>{S.cIcon=ic;render()};
A.addF=async()=>{
  const n=$('#fn').value.trim();
  if(!n)return;
  try{
    let tid=null;
    const q=await getDocs(query(collection(db,'users'),where('nameL','==',n.toLowerCase()),limit(1)));
    if(q.docs.length)tid=q.docs[0].id;
    else{const d=await getDoc(doc(db,'users',n));if(d.exists())tid=d.id}
    if(!tid)return toast('Joueur introuvable');
    if(tid===uid)return toast('C\'est ton propre compte !');
    if((U().friends||[]).includes(tid))return toast('Vous êtes déjà amis');
    await updateDoc(doc(db,'users',tid),{reqs:arrayUnion({uid,name:U().name})});
    notif(tid,`👥 ${U().name} t'a envoyé une demande d'ami`);
    toast('Demande d\'ami envoyée !');
  }catch(e){fail(e)}
};
A.reqOk=async p=>{
  const [i,n]=p.split('|'),r={uid:i,name:n},b=writeBatch(db);
  b.update(ME(),{friends:arrayUnion(i),reqs:arrayRemove(r)});
  b.update(doc(db,'users',i),{friends:arrayUnion(uid)});
  await b.commit().catch(fail);
  notif(i,`👥 ${U().name} a accepté ta demande d'ami`);
};
A.reqNo=p=>{
  const [i,n]=p.split('|');
  saveU({reqs:arrayRemove({uid:i,name:n})});
};
A.tradeWith=async i=>{S.tab='trade';await A.tSel(i)};

A.mkC=async()=>{
  const n=$('#cn2')?.value.trim();
  const tag=($('#ctag')?.value.trim()||'').toUpperCase().slice(0,4);
  const desc=$('#cdesc')?.value.trim()||'';
  if(!n||n.length<3)return toast('Le nom du clan doit contenir au moins 3 caractères');
  try{
    const r=await addDoc(collection(db,'clans'),{
      name:n,tag,icon:S.cIcon||'⚔️',desc,owner:uid,
      members:[uid],roles:{[uid]:'leader'},treasury:0,
      quests:{packs:0,coins:0,rares:0},ts:Date.now()
    });
    await saveU({clan:r.id,clanContributed:0});
    toast('Clan fondé avec succès !');
  }catch(e){fail(e)}
};
A.joinC=async id=>{
  try{
    await updateDoc(doc(db,'clans',id),{members:arrayUnion(uid)});
    await saveU({clan:id});
    toast('Tu as rejoint le clan !');
  }catch(e){fail(e)}
};
A.leaveC=async()=>{
  const id=U().clan;
  if(!id)return;
  await updateDoc(doc(db,'clans',id),{members:arrayRemove(uid)}).catch(()=>{});
  await saveU({clan:null});
  toast('Tu as quitté le clan.');
};
A.donateC=async()=>{
  const amt=Math.max(0,+$('#donAmt')?.value||0);
  if(amt<10)return toast('Montant minimum : 10 AC');
  if((U().ac||0)<amt)return toast('AnimeCoins insuffisants');
  const cid=U().clan;
  if(!cid)return;
  try{
    await runTransaction(db,async tx=>{
      const ur=ME(),cr=doc(db,'clans',cid);
      const us=await tx.get(ur),cs=await tx.get(cr);
      if(!cs.exists())throw 'Clan introuvable';
      const uac=us.data().ac||0;
      if(uac<amt)throw 'AnimeCoins insuffisants';
      const cdata=cs.data();
      const q=cl(cdata.quests||{packs:0,coins:0,rares:0});
      q.coins=(q.coins||0)+amt;
      tx.update(ur,{ac:uac-amt,clanContributed:(us.data().clanContributed||0)+amt});
      tx.update(cr,{treasury:(cdata.treasury||0)+amt,quests:q});
    });
    toast(`Merci ! +${amt.toLocaleString()} AC versés au coffre du clan.`);
  }catch(e){fail(e)}
};
A.toggleOfficer=async targetUid=>{
  if(!S.clan||S.clan.owner!==uid)return;
  const roles=cl(S.clan.roles||{});
  roles[targetUid]=roles[targetUid]==='officer'?'member':'officer';
  await updateDoc(doc(db,'clans',S.clan.id),{roles});
  toast('Rôle du membre mis à jour');
};
A.claimClanQ=async qid=>{
  if(!S.clan)return;
  const q=CLAN_QUESTS.find(x=>x.id===qid);
  if(!q)return;
  const cur=(S.clan.quests||{})[q.key]||0;
  const key=S.clan.id+'_'+qid;
  if(cur<q.goal||(U().clanQuestsClaimed||[]).includes(key))return;
  await saveU({
    ac:(U().ac||0)+q.rew,
    earned:(U().earned||0)+q.rew,
    clanQuestsClaimed:arrayUnion(key)
  });
  toast(`Quête de clan validée : +${q.rew} AC !`);
};
A.say=async()=>{
  const i=$('#cm'),t=i.value.trim();
  if(!t||!U().clan)return;
  i.value='';
  await addDoc(collection(db,'clans',U().clan,'chat'),{u:uid,name:U().name,t,ts:Date.now()}).catch(fail);
};

/* ============ 14. SYSTÈME DE SUCCÈS (ACHIEVEMENTS) ============ */
function getAchList(){
  const u=U(),st=stacks(u.inv);
  const distinct=Object.keys(u.inv||{}).length;
  const hasLM=Object.keys(u.inv||{}).some(id=>['L','M'].includes(cd(id).rar));
  const totalGraded=Math.max(u.gradedCount||0,st.filter(s=>s.g>0).reduce((a,s)=>a+s.n,0));
  const psa10=st.filter(s=>s.g===10).reduce((a,s)=>a+s.n,0);
  const claimed=u.ach||[];

  const defs=[
    {id:'ach_pack1',title:'Premier Frisson',desc:'Ouvrir ton tout premier booster',cur:u.opened||0,goal:1,rew:100,icon:'🎴'},
    {id:'ach_pack25',title:'Ouverture en Série',desc:'Ouvrir 25 boosters au total',cur:u.opened||0,goal:25,rew:400,icon:'⚡'},
    {id:'ach_god',title:'Élu des Dieux',desc:'Obtenir une carte Légendaire ou Mythique dans ta collection',cur:hasLM?1:0,goal:1,rew:300,icon:'🌟'},
    {id:'ach_col50',title:'Collectionneur Aguerri',desc:'Posséder 50 cartes distinctes dans ton inventaire',cur:distinct,goal:50,rew:500,icon:'📚'},
    {id:'ach_col200',title:'Archiviste Suprême',desc:'Posséder 200 cartes distinctes dans ton inventaire',cur:distinct,goal:200,rew:1500,icon:'🏛️'},
    {id:'ach_grade5',title:'Expert Certifié',desc:'Faire grader ou posséder au moins 5 cartes gradées PSA',cur:totalGraded,goal:5,rew:250,icon:'🔎'},
    {id:'ach_psa10',title:'Chasseur de Gem Mint',desc:'Obtenir une carte certifiée note PSA 10',cur:psa10,goal:1,rew:1000,icon:'💎'},
    {id:'ach_rich',title:'Magnat des Affaires',desc:'Cumuler 5 000 AnimeCoins gagnés au total',cur:u.earned||0,goal:5000,rew:600,icon:'🪙'}
  ];
  return defs.map(d=>({
    ...d,
    done:d.cur>=d.goal,
    claimed:claimed.includes(d.id),
    pct:Math.min(100,Math.round((d.cur/d.goal)*100))
  }));
}

function vAch(){
  const list=getAchList();
  const doneCount=list.filter(x=>x.claimed).length;
  return `<div class="space-y-4">
    <div class="glass p-4 flex items-center justify-between flex-wrap gap-2">
      <div>
        <h2 class="font-bold text-lg text-white">🏆 Succès & Trophées</h2>

      </div>
      <div class="px-3 py-1.5 rounded-lg bg-white/5 text-sm font-semibold text-indigo-300">
        Complétés : ${doneCount} / ${list.length}
      </div>
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      ${list.map(a=>`<div class="glass p-4 flex items-start gap-3.5 border ${a.done&&!a.claimed?'border-amber-400/50 bg-amber-500/[0.04]':'border-white/10'}">
        <div class="w-11 h-11 rounded-xl bg-white/5 flex items-center justify-center text-2xl shrink-0">${a.icon}</div>
        <div class="flex-1 min-w-0 space-y-1.5">
          <div class="flex items-center justify-between gap-2">
            <h3 class="font-bold text-sm text-white truncate">${a.title}</h3>
            <span class="text-xs font-bold text-amber-300 shrink-0">+${a.rew} AC</span>
          </div>
          <p class="text-xs text-slate-400">${a.desc}</p>

            </div>

              :a.done
                ?`<button class="btn text-xs py-1 px-3" data-a="claimAch" data-p="${a.id}">🎁 Réclamer +${a.rew} AC</button>`

          </div>
        </div>
      </div>`).join('')}

A.claimAch=async id=>{
  const a=getAchList().find(x=>x.id===id);
  if(!a||!a.done||a.claimed)return;
  await saveU({
    ac:(U().ac||0)+a.rew,
    earned:(U().earned||0)+a.rew,
    ach:arrayUnion(id)
  });
  toast(`🏆 Succès "${a.title}" débloqué : +${a.rew} AC !`);
};

        </div>

        <div class="pt-2 border-t border-white/10 space-y-2">
          <label class="block text-xs font-semibold text-indigo-300">🖼️ Photo de profil : Choisir une carte possédée</label>
          <select class="w-full" data-c="pAvCard">
            <option value="">— Utiliser un émoji classique —</option>
            ${ownedIds.map(id=>`<option value="${id}" ${u.avCard===id?'selected':''}>${E(cd(id).name)} (${R[cd(id).rar].n})</option>`).join('')}
          </select>
          <div class="flex gap-1.5 flex-wrap items-center">
            <span class="text-xs text-slate-400 mr-1">Ou émoji :</span>
            ${AV.map(a=>`<button class="btn2 text-sm px-2 py-1" data-a="pAv" data-p="${a}">${a}</button>`).join('')}
          </div>
        </div>

        <div class="pt-2 border-t border-white/10 space-y-2">
          <label class="block text-xs text-slate-400">⭐ Carte maîtresse exposée</label>
          <select class="w-full" data-c="pMaster">
            <option value="">— Aucune —</option>
            ${Object.keys(u.inv||{}).map(id=>`<option value="${id}" ${m===id?'selected':''}>${E(cd(id).name)} (${R[cd(id).rar].n})</option>`).join('')}
          </select>
          ${m?`<div class="w-36 pt-1">${card(cd(m))}</div>`:''}
        </div>
      </div>

      <div class="glass p-4 space-y-3 text-sm h-fit">
        <h3 class="font-bold text-white">📈 Statistiques du Joueur</h3>
        <div class="stats text-xs sm:text-sm">
          <p><span>Boosters ouverts</span><b>${(u.opened||0).toLocaleString()}</b></p>
          <p><span>Cartes possédées (total)</span><b>${st.reduce((a,s)=>a+s.n,0).toLocaleString()}</b></p>
          <p><span>Cartes distinctes</span><b>${Object.keys(u.inv||{}).length.toLocaleString()}</b></p>
          <p><span>Valeur de la collection</span><b class="text-amber-300">${invVal(u.inv).toLocaleString()} AC</b></p>
          <p><span>AnimeCoins gagnés (cumul)</span><b>${(u.earned||0).toLocaleString()} AC</b></p>
          <p><span>Cartes certifiées PSA 10</span><b class="text-indigo-300">${g10}</b></p>
          <p><span>Succès débloqués</span><b>${(u.ach||[]).length} / 8</b></p>
          <p><span>Wishlist · Amis</span><b>${(u.wish||[]).length} · ${(u.friends||[]).length}</b></p>
        </div>

        <h3 class="font-bold text-white pt-3">⚙️ Paramètres du Compte</h3>
        <label class="flex gap-2 items-center text-xs cursor-pointer p-2 rounded bg-white/5">
          <input type="checkbox" ${u.nsfw?'checked':''} data-c="pNsfw"> Afficher le contenu 18+ / NSFW (isAdult)
        </label>
        <div class="pt-2">
          <button class="btn2 w-full text-rose-300 border-rose-500/30 hover:bg-rose-500/10" data-a="logout">Déconnexion du compte</button>
        </div>
      </div>
    </div>
  </div>`;
}

A.pName=v=>{v=v.trim();if(v.length>=3)saveU({name:v,nameL:v.toLowerCase()})};
A.pBio=v=>saveU({bio:v});
A.pTitle=v=>saveU({title:v});
A.pAv=v=>saveU({av:v,avImg:'',avCard:''});
A.pAvCard=id=>{
  if(!id)return saveU({avImg:'',avCard:''});
  const c=cd(id);
  saveU({avImg:c.img||'',avCard:id});
  toast('Photo de profil mise à jour !');
};
A.pBan=v=>saveU({banner:+v});
A.pMaster=v=>saveU({master:v});
A.pNsfw=async(v,el)=>{
  await saveU({nsfw:el.checked});
  if(el.checked&&!POOL.some(p=>p.adult)){
    toast('Chargement du catalogue 18+ en arrière-plan…');
    try{
      let all=await idbAll();
      for(const j of ADJ){
        const rows=await fetchJob(j);
        all.push(...rows);
        await idbPut(rows);
        await sleep(1200);
      }
      rarify(all);
      reg(all);
      toast('Contenu 18+ activé');
    }catch(e){fail(e)}
  }
};

boot().catch(e=>showErr(e.message||e));
</script>
</body>
