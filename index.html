.screen-flash{position:fixed;inset:0;z-index:90;pointer-events:none;animation:flashScreen .85s ease-out forwards}
.ptc{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:99px;pointer-events:none;z-index:20;animation:partOut .95s cubic-bezier(.16,1,.3,1) forwards}
.scan{position:absolute;left:0;right:0;height:2px;background:#818cf8;box-shadow:0 0 12px #818cf8;animation:sc 1s ease-in-out infinite alternate;z-index:5}
@keyframes sc{from{top:0}to{top:100%}}
.stats p{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:.42rem 0}
.scroll-y{max-height:9rem;overflow-y:auto;padding-right:.4rem}
.scroll-y::-webkit-scrollbar{width:5px}.scroll-y::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:9px}

function descChar(x){
  const e=x.media?.edges?.[0],n=e?.node,t=n?(n.title.english||n.title.romaji):null;
  const g=x.gender==='Female'?'f':x.gender==='Male'?'m':'';
  const pr=g==='f'?'elle':g==='m'?'il':'il ou elle';
  const role=e?.characterRole==='MAIN'?'un rôle principal':e?.characterRole==='SUPPORTING'?'un rôle secondaire':'une apparition';
  let s=`${x.name.full} est un personnage ${g==='f'?'féminin':g==='m'?'masculin':'singulier'} ${t?`issu de « ${t} »${n.format?' ('+(FMT_FR[n.format]||'œuvre')+(n.seasonYear?', '+n.seasonYear:'')+')':''}, où ${pr} tient ${role}.`:'issu de l\'animation et du manga japonais.'}`;
  if(x.age)s+=` Âge indiqué : ${x.age}.`;
  if(n?.genres?.length)s+=` L'œuvre appartient aux genres ${gfr(n.genres)}.`;
  return s+` Ce personnage est adoré par ${nf(x.favourites)} fans sur AniList.`;
}
function descMedia(x,k){
  const t=x.title.english||x.title.romaji,isM=k==='n',yr=x.startDate?.year||x.seasonYear,st=x.studios?.nodes?.[0]?.name;
  let s=`« ${t} » est ${isM?'un manga':'une œuvre d\'animation'}${x.format?' de type '+(FMT_FR[x.format]||x.format):''}${yr?', débuté en '+yr:''}.`;
  if(!isM&&st)s+=` Elle a été produite par le studio ${st}.`;
  if(!isM&&x.episodes)s+=` Elle compte ${x.episodes} épisode${x.episodes>1?'s':''}.`;
  if(isM&&x.chapters)s+=` Il compte ${x.chapters} chapitres.`;
  if(x.genres?.length)s+=` Genres : ${gfr(x.genres)}.`;
  if(x.averageScore)s+=` Note moyenne du public : ${x.averageScore}/100.`;
  if(x.status)s+=` Statut : ${ST_FR[x.status]||'inconnu'}.`;
  return s+` Elle figure dans les favoris de ${nf(x.favourites)} utilisateurs d'AniList.`;
}
async function gql(q,v){
  for(let i=0;i<5;i++){
    const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:q,variables:v})});
    if(r.status===429){await sleep((+r.headers.get('retry-after')||20)*1000+1000);continue}
    if(!r.ok)throw new Error('AniList HTTP '+r.status);
    return (await r.json()).data.Page;
  }
  throw new Error('Limite de requêtes AniList atteinte');
}
const QC='query($p:Int){Page(page:$p,perPage:50){characters(sort:FAVOURITES_DESC){id name{full} gender age image{large} favourites media(perPage:1,sort:POPULARITY_DESC){edges{characterRole node{title{romaji english} seasonYear format genres}}}}}}';
const QM='query($p:Int,$t:MediaType,$a:Boolean){Page(page:$p,perPage:50){media(type:$t,sort:FAVOURITES_DESC,isAdult:$a){id idMal title{romaji english} coverImage{extraLarge} favourites format episodes chapters seasonYear startDate{year} genres averageScore status studios(isMain:true){nodes{name}}}}}';
const qrar=q=>q<.005?'M':q<.03?'L':q<.13?'E':q<.40?'R':'C';
const PLAN={c:4500,f:5000,m:500,x:300};
async function fetchJob(job){
  const k=job[0],p=+job.slice(1).replace('x',''),a=job.endsWith('x');
  if(k==='c'){
    const d=await gql(QC,{p});
    return (d.characters||[]).map((x,i)=>{const rk=(p-1)*50+i;return{id:'c'+x.id,kind:'c',name:x.name.full,img:x.image?.large||'',fav:x.favourites||0,desc:descChar(x),job,adult:false,rk,rar:qrar(rk/PLAN.c)}});
  }
  const d=await gql(QM,{p,t:k==='a'?'ANIME':'MANGA',a});
  return (d.media||[]).map((x,i)=>{
    const rk=(p-1)*50+i,g=a?rk:rk*2+(k==='n'?1:0);
    return{id:k+x.id,kind:k,name:x.title.english||x.title.romaji,img:x.coverImage?.extraLarge||'',fav:x.favourites||0,desc:descMedia(x,k),year:x.startDate?.year||x.seasonYear||0,mal:x.idMal||0,job,adult:a,rk,rar:qrar(g/(a?PLAN.x:PLAN.f))};
  });
}
/* Rareté de base : personnages et franchises = rang absolu (voir fetchJob) ; musiques = rang trié des animes parents */

}

for(let i=1;i<=90;i++){for(const j of ['c'+i].concat(i<=50?['a'+i,'n'+i]:[]))if(!JOBS.includes(j))JOBS.push(j)}

async function jikan(path){
  for(let i=0;i<3;i++){
    const r=await fetch('https://api.jikan.moe/v4/'+path);
    if(r.status===429){await sleep(4000);continue}
    if(!r.ok)throw new Error('Jikan HTTP '+r.status);
    return (await r.json()).data;
  }
  throw new Error('Jikan indisponible');
}
function parseTheme(s){
  s=String(s).replace(/^\s*#?\d+\s*:\s*/,'');
  const m=s.match(/^"(.+?)"(?:\s+by\s+(.+?))?(?:\s*\((?:eps?|ep)[^)]*\))?\s*$/i);
  if(!m)return null;
  const jp=/\s*\([^)]*[\u3000-\u9fff\uff00-\uffef][^)]*\)/g;
  const name=m[1].replace(jp,'').trim(),by=(m[2]||'').replace(jp,'').trim();
  return name?{name,by}:null;
}
/* Sous-catalogue musical : openings / endings réels (Jikan) rattachés aux animes les plus aimés */
async function musicLoop(done){
  for(let w=0;w<40&&[...BGMAP.values()].filter(x=>x.kind==='a'&&x.mal).length<140;w++)await sleep(2000);
  const src=[...BGMAP.values()].filter(x=>x.kind==='a'&&x.mal&&!x.adult).sort((a,b)=>b.fav-a.fav).slice(0,150);
  let count=[...BGMAP.values()].filter(x=>x.kind==='o'||x.kind==='e').length;
  for(const a of src){
    if(count>=500)break;
    if(done.has('mu'+a.mal))continue;
    try{
      const d=await jikan(`anime/${a.mal}/themes`),rows=[];
      const add=(arr,kind,lim)=>(arr||[]).slice(0,lim).forEach((s,i)=>{
        const p=parseTheme(s);if(!p)return;
        rows.push({id:kind+a.mal+'_'+i,kind,name:p.name,by:p.by,img:a.img,fav:a.fav,job:'mu'+a.mal,adult:false,
          desc:`« ${p.name} » est l'${kind==='o'?'opening':'ending'} n°${i+1} de « ${a.name} »${a.year?' ('+a.year+')':''}${p.by?`, interprété par ${p.by}`:''}. Cette musique d'anime ${kind==='o'?'ouvre':'clôture'} les épisodes de l'œuvre, adorée par ${nf(a.fav)} fans sur AniList.`});
      });
      add(d.openings,'o',3);add(d.endings,'e',2);
      rows.forEach(r=>BGMAP.set(r.id,r));count+=rows.length;
      refresh();await idbPut(rows);
    }catch(e){await sleep(5000)}
    await sleep(1300);
  }
}
async function bgLoad(all){
  if(bgLoading)return;
  bgLoading=true;
  BGMAP=new Map(all.filter(x=>x.job!=='fb').map(x=>[x.id,x]));
  const done=new Set([...BGMAP.values()].map(x=>x.job));
  const todo=JOBS.filter(j=>!done.has(j));
  updateBgBadge();
  musicLoop(done).catch(()=>{});
  for(const j of todo){
    for(let t=0;t<2;t++){
      try{const rows=await fetchJob(j);rows.forEach(r=>BGMAP.set(r.id,r));refresh();await idbPut(rows);break}
      catch(e){await sleep(4000)}
    }
    await sleep(1400);
  }
  refresh();
  await idbPut([...BGMAP.values()]);
  bgLoading=false;updateBgBadge();
}

/* ============ 5. CARTES : RARETÉ DE BASE / RARETÉ DYNAMIQUE DU MARCHÉ / PRIX DE REVENTE ============ */
const KL={c:'Personnage',a:'Anime',n:'Manga',o:'Opening',e:'Ending'};
const TP={c:['PERSONNAGE',''],a:['FRANCHISE','f'],n:['FRANCHISE','f'],o:['OPENING','m'],e:['ENDING','m']};
const cd=id=>PM.get(id)||{id,name:'Carte #'+id,img:'',rar:'C',kind:'c',fav:0,desc:'Carte du catalogue AnimeCards.'};
/* Prix de revente : calculé UNIQUEMENT sur la rareté de base (anti-manipulation du marché) */
const val=(id,g)=>Math.round(R[cd(id).rar].v*(g?gm(g):1));
const sellP=(id,g)=>Math.max(1,Math.round(val(id,g)*.3));
/* Rareté dynamique : fluctue selon volume et prix moyen des ventes réelles (affichage uniquement) */
function buildMarket(){
  const m=new Map(),pairs=new Map();
  (S.allAuc||[]).forEach(a=>{
    if(a.status!=='closed'||!a.bidder)return;
    const pk=a.card+'|'+a.seller+'|'+a.bidder,n=(pairs.get(pk)||0)+1;
    pairs.set(pk,n);if(n>2)return;
    const o=m.get(a.card)||{n:0,sum:0};
    o.n++;o.sum+=(+a.bid||0)/(a.grade?gm(a.grade):1);
    m.set(a.card,o);
  });
  MK=m;
}
function er(c){
  const o=MK.get(c.id);
  if(!o||o.n<3)return c.rar;
  const ratio=(o.sum/o.n)/R[c.rar].v,pr=ratio*(1+Math.min(o.n,10)/10);
  let i=RO.indexOf(c.rar);
  if(pr>=6)i+=2;else if(pr>=3)i+=1;else if(ratio<.4)i-=1;
  return RO[Math.max(0,Math.min(4,i))];
}
function card(c,g=0){
  const d=c.desc||'Carte du catalogue AnimeCards.',r=er(c),arrow=r!==c.rar?(RO.indexOf(r)>RO.indexOf(c.rar)?' ▲':' ▼'):'',tp=TP[c.kind]||TP.c;
  return `<div class="card tilt r-${r}" style="--hue:${hue(c.id)}" title="${E(c.name)}">
    <div class="art"><b>${E((c.name||'?')[0])}</b>${c.img?`<img src="${E(c.img)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">`:''}</div>
    <div class="shine"></div><span class="rl">${R[r].n}${arrow}</span><span class="tp ${tp[1]}">${tp[0]}</span>
    <div class="nm"><div class="truncate">${E(c.name)}</div><div class="cdesc">${E(d)}</div><div class="val">🪙 ${sellP(c.id,g).toLocaleString()} AC</div></div>
  </div>`;
}
const slab=(c,g=0)=>g?`<div class="slab"><div class="lab"><span>PSA · ANIMECARDS</span><b>${g} ${GN[g]}</b></div>${card(c,g)}</div>`:card(c,0);
const tile=(s,act,sel)=>`<div class="relative ${sel?'sel':''}" data-a="${act}" data-p="${s.id}|${s.g}">${s.n>1?`<span class="cnt">x${s.n}</span>`:''}${slab(cd(s.id),s.g)}</div>`;

const cnt=(inv,id,g)=>g?(inv?.[id]?.g||[]).filter(x=>x===g).length:(inv?.[id]?.q||0);
const cntTotal=(inv,id)=>(inv?.[id]?.q||0)+((inv?.[id]?.g||[]).length);
const addC=(inv,id,g,n=1)=>{const o=inv[id]||(inv[id]={q:0,g:[]});if(!Array.isArray(o.g))o.g=[];if(typeof o.q!=='number')o.q=0;if(g)for(let i=0;i<n;i++)o.g.push(g);else o.q+=n};
const subC=(inv,id,g,n=1)=>{const o=inv?.[id];if(!o||cnt(inv,id,g)<n)return false;if(g){for(let i=0;i<n;i++)o.g.splice(o.g.indexOf(g),1)}else o.q-=n;if(!o.q&&(!o.g||!o.g.length))delete inv[id];return true};
const stacks=inv=>{const r=[];for(const id in inv||{}){if(inv[id]?.q)r.push({id,g:0,n:inv[id].q});const m={};(inv[id]?.g||[]).forEach(x=>m[x]=(m[x]||0)+1);for(const g in m)r.push({id,g:+g,n:m[g]})}return r};
const invVal=inv=>stacks(inv).reduce((a,s)=>a+sellP(s.id,s.g)*s.n,0);

async function doOpen(welcome){
  if(S.P)return;

  if(welcome){if((U().welcomePacks||0)<1)return}
  else{({p,l}=curPacks());if(p<1)return toast('Aucun booster disponible pour le moment')}

  if(!POOL.length)return toast('Catalogue en cours de chargement…');
  const w=welcome?W_WEL:W_STD;
  const cs=[...Array(5)].map(()=>draw(w)).sort((a,b)=>RO.indexOf(cd(a).rar)-RO.indexOf(cd(b).rar));
  const inv=cl(U().inv||{});
  const ownedBefore=cs.map(id=>{const b=cntTotal(inv,id);addC(inv,id,0,1);return b});
  S.P={cs,ownedBefore,i:0,tear:0,flip:0,welcome};pov();
  try{
    const extra=welcome?{welcomePacks:Math.max(0,(U().welcomePacks||1)-1)}:{packs:p-1,last:l};
    await saveInv(inv,{...extra,opened:(U().opened||0)+1});
    if(U().clan){
      const hi=cs.filter(id=>['L','M'].includes(cd(id).rar)).length,cr=doc(db,'clans',U().clan);

function spawnParticles(rar){
  const cols=rar==='M'?['#f472b6','#60a5fa','#facc15','#34d399','#a78bfa']:['#facc15','#f59e0b','#fde047','#ffffff'];let h='';
  for(let i=0;i<28;i++){const a=(Math.PI*2*i)/28+Math.random()*.3,d=95+Math.random()*95,c=cols[i%cols.length];
    h+=`<span class="ptc" style="background:${c};box-shadow:0 0 8px ${c};--tx:${Math.round(Math.cos(a)*d)}px;--ty:${Math.round(Math.sin(a)*d)}px"></span>`}
  return h;
}
function pov(){
  const P=S.P;
  if(!P.tear)return modal(`<div class="text-center space-y-3"><div class="pack ${P.welcome?'gold':''}" id="pk1" data-a="tear">${boosterVisualHTML('CLIQUE POUR DÉCHIRER',P.welcome)}</div><p class="text-xs text-slate-400">Clique sur le booster pour l'ouvrir</p></div>`,1);
  const id=P.cs[P.i],c=cd(id),prev=P.ownedBefore[P.i],isL=c.rar==='L',isM=c.rar==='M',hi=isL||isM;
  const flash=P.flip&&hi?`<div class="screen-flash" style="background:${isM?'radial-gradient(circle,rgba(244,114,182,.55),rgba(96,165,250,.45),transparent 75%)':'radial-gradient(circle,rgba(250,204,21,.55),transparent 75%)'}"></div>`:'';
  const badge=P.flip?(prev===0?`<div class="inline-flex px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 mb-2">✨ NOUVELLE CARTE</div>`:`<div class="inline-flex px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/15 text-amber-300 border border-amber-400/30 mb-2">Déjà possédée (x${prev})</div>`):`<div class="h-6 mb-2"></div>`;
  const banner=P.flip&&hi?`<div class="mb-2 text-xs font-extrabold tracking-widest uppercase ${isM?'text-pink-400':'text-amber-300'} animate-pulse">TIRAGE EXCEPTIONNEL · ${R[c.rar].n.toUpperCase()} !</div>`:'';
  modal(`${flash}<div class="text-center w-60 sm:w-64 ${P.flip&&hi?'shake':''}">${banner}${badge}
    <div class="relative" data-a="nextC">${P.flip&&isL?'<div class="halo-L"></div>':''}${P.flip&&isM?'<div class="halo-M"></div>':''}${P.flip&&hi?spawnParticles(c.rar):''}
    ${P.flip?`<div class="relative z-10 fx-${c.rar}">${card(c)}</div>`:'<div class="card back">✦</div>'}</div>
    <p class="mt-4 text-xs text-slate-400">${P.i+1}/5 — ${P.flip?(P.i<4?'Clique pour la carte suivante':'Clique pour terminer'):'Clique sur la carte pour la révéler'}</p></div>`,1);
}
A.tear=()=>{AU.swoosh();$('#pk1')?.classList.add('torn');setTimeout(()=>{S.P.tear=1;pov()},480)};
A.nextC=()=>{
  const P=S.P;
  if(!P.flip){P.flip=1;AU.flip();if(['L','M'].includes(cd(P.cs[P.i]).rar))setTimeout(()=>AU.jingle(),220);return pov()}
  if(P.i<4){P.i++;P.flip=0;return pov()}
  S.P=null;closeM();render();
};

/* ============ 9. COLLECTION, ALBUMS & ANALYSE DU MARCHÉ ============ */
const keyOf=s=>s.id+'|'+s.g;
const parse=k=>{const [i,g]=String(k).split('|');return{id:i,g:+(g||0)}};
function filtered(){
  const F=S.F,al=F.a?(U().albums||{})[F.a]||[]:null;
  return stacks(U().inv).filter(s=>{
    const c=cd(s.id);
    if(F.q&&!c.name.toLowerCase().includes(F.q.toLowerCase()))return false;
    if(F.r&&c.rar!==F.r)return false;
    if(F.g==='g'&&!s.g)return false;if(F.g==='u'&&s.g)return false;
    if(F.d&&s.n<2)return false;
    if(al&&!al.includes(keyOf(s)))return false;
    return true;
  }).sort((a,b)=>RO.indexOf(cd(b.id).rar)-RO.indexOf(cd(a.id).rar)||b.g-a.g||sellP(b.id,b.g)-sellP(a.id,a.g));
}
function vCol(){
  const F=S.F;
  return `<div class="space-y-4"><div class="glass p-3 flex flex-wrap gap-2 items-center">
    <input placeholder="Rechercher dans ma collection…" value="${E(F.q)}" data-i="fq" class="flex-1 min-w-[160px]">
    <select data-c="fr"><option value="">Toutes raretés</option>${RO.map(k=>`<option value="${k}" ${F.r===k?'selected':''}>${R[k].n}</option>`).join('')}</select>
    <select data-c="fg"><option value="">Toute gradation</option><option value="g" ${F.g==='g'?'selected':''}>Gradées (PSA)</option><option value="u" ${F.g==='u'?'selected':''}>Non gradées</option></select>
    <select data-c="fa"><option value="">Tous les albums</option>${Object.keys(U().albums||{}).map(a=>`<option ${F.a===a?'selected':''}>${E(a)}</option>`).join('')}</select>
    <label class="text-xs flex items-center gap-1.5 px-2 py-1 rounded bg-white/5 cursor-pointer"><input type="checkbox" ${F.d?'checked':''} data-c="fd"> Doublons</label>
    <button class="btn2" data-a="newAlbum">＋ Album</button><button class="btn2" data-a="sellDup">♻ Vendre doublons</button></div>
    <p id="cn" class="text-xs text-slate-400"></p><div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-3"></div><div id="col-more" class="text-center pt-2"></div></div>`;
}
function colUpd(){
  const L=filtered(),cn=$('#cn'),gr=$('#grid'),mr=$('#col-more');if(!cn||!gr)return;
  cn.textContent=`${L.length} pile(s) affichée(s) · Valeur totale de revente : ${invVal(U().inv).toLocaleString()} AC`;
  const sl=L.slice(0,S.F.n||60);
  gr.innerHTML=sl.map(s=>tile(s,'show')).join('')||'<p class="col-span-full text-sm text-slate-500 py-8 text-center">Aucune carte ne correspond à ces critères.</p>';
  if(mr)mr.innerHTML=L.length>sl.length?`<button class="btn2" data-a="moreCol">Afficher plus (${L.length-sl.length} restantes)</button>`:'';

A.fq=v=>{S.F.q=v;S.F.n=60;colUpd()};A.fr=v=>{S.F.r=v;S.F.n=60;colUpd()};A.fg=v=>{S.F.g=v;S.F.n=60;colUpd()};A.fa=v=>{S.F.a=v;S.F.n=60;colUpd()};
A.fd=(v,el)=>{S.F.d=el.checked;S.F.n=60;colUpd()};A.moreCol=()=>{S.F.n=(S.F.n||60)+60;colUpd()};
A.newAlbum=()=>{const n=prompt('Nom du nouvel album :');if(n&&!(U().albums||{})[n])saveU({['albums.'+n.replace(/\./g,'_')]:[]})};
A.sellDup=async()=>{
  const inv=cl(U().inv||{});let g=0,n=0;
  for(const id in inv){const q=inv[id].q;if(q>1){g+=(q-1)*sellP(id,0);n+=q-1;inv[id].q=1}}
  if(!n)return toast('Aucun doublon non gradé à vendre');
  await saveInv(inv,{ac:(U().ac||0)+g,earned:(U().earned||0)+g});toast(`${n} doublon(s) vendus : +${g.toLocaleString()} AC`);
};
function getCardMarketStats(id){
  const list=(S.allAuc||[]).filter(a=>a.card===id&&(a.status==='open'||a.bidder)),by={};
  list.forEach(a=>{const g=+(a.grade||0);(by[g]=by[g]||[]).push(+(a.bid||0))});
  const avgByGrade={};for(const g in by)avgByGrade[g]={avg:Math.round(by[g].reduce((s,v)=>s+v,0)/by[g].length),count:by[g].length};
  return{totalCount:list.length,avgByGrade};
}

    <div class="p-2 rounded bg-white/5 flex justify-between"><span class="text-slate-300">État actuel (<b>${g?'PSA '+g:'Non gradée'}</b>) :</span>${cur?`<b class="text-amber-300">${cur.avg.toLocaleString()} AC <span class="text-[10px] font-normal text-slate-400">(${cur.count})</span></b>`:'<span class="text-slate-400 italic">Aucune donnée</span>'}</div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-1 text-[11px]">${others.map(x=>`<div class="p-1.5 rounded flex justify-between ${x===g?'bg-indigo-500/25 border border-indigo-400/40':'bg-white/5'}"><span class="text-slate-300">${x?'PSA '+x:'Non gradée'}</span><b class="text-white">${avgByGrade[x].avg.toLocaleString()} AC</b></div>`).join('')}</div></div>`;

A.bid=async aid=>{
  const v=+$('#b'+aid).value;let prev=null,nm='';
  try{
    await runTransaction(db,async tx=>{
      const ar=doc(db,'auctions',aid),a=(await tx.get(ar)).data();
      if(!a||a.status!=='open'||a.end<=Date.now())throw 'Enchère terminée';
      if(a.seller===uid)throw 'Impossible de miser sur ta propre vente';
      if((v<=a.bid&&a.bidder)||v<a.bid)throw 'Mise trop basse';
      const mr=ME(),ms=await tx.get(mr);let ac=ms.data().ac||0,pr,ps;
      if(a.bidder&&a.bidder!==uid){pr=doc(db,'users',a.bidder);ps=await tx.get(pr)}
      if(a.bidder===uid)ac+=a.bid;
      if(ac<v)throw 'AnimeCoins insuffisants';
      tx.update(mr,{ac:ac-v});if(ps)tx.update(pr,{ac:(ps.data().ac||0)+a.bid});
      tx.update(ar,{bid:v,bidder:uid,bidderName:U().name});prev=ps?a.bidder:null;nm=cd(a.card).name;
    });
    toast('Mise placée avec succès !');
    if(prev)notif(prev,`⚠️ ${U().name} a surenchéri sur ${nm} (${v} AC) — ta mise t'a été remboursée.`,'col');

async function settle(aid){
  try{
    let info;
    await runTransaction(db,async tx=>{
      const ar=doc(db,'auctions',aid),a=(await tx.get(ar)).data();info=null;
      if(!a||a.status!=='open'||a.end>Date.now())return;
      const sr=doc(db,'users',a.seller),ss=await tx.get(sr);let br,bs;
      if(a.bidder){br=doc(db,'users',a.bidder);bs=await tx.get(br)}
      let finalBidder=a.bidder;
      if(a.bidder&&bs?.exists()){
        const si=ss.data();tx.update(sr,{ac:(si.ac||0)+a.bid,earned:(si.earned||0)+a.bid});
        const inv=cl(bs.data().inv||{});addC(inv,a.card,a.grade);tx.update(br,{inv,val:invVal(inv)});
      }else{
        finalBidder=null;const inv=cl(ss.data().inv||{});addC(inv,a.card,a.grade);tx.update(sr,{inv,val:invVal(inv)});
      }
      tx.update(ar,{status:'closed',closedAt:Date.now(),...(finalBidder?{}:{bidder:null,bidderName:''})});
      info={...a,bidder:finalBidder};
    });
    if(info){
      const n=cd(info.card).name;
      if(info.bidder){notif(info.bidder,`🏆 Tu as remporté ${n} aux enchères pour ${info.bid} AC !`,'col');notif(info.seller,`💰 ${n} a été vendu ${info.bid} AC à ${info.bidderName} !`,'col')}
      else notif(info.seller,`${n} n'a pas trouvé preneur : la carte t'a été restituée.`,'col');
    }
  }catch(e){}
}
function tick(){

  document.querySelectorAll('[data-end]').forEach(e=>e.textContent=fmt(Math.max(0,(e.dataset.end-now)/1e3)));
  if(now-(tick.s||0)>5000){tick.s=now;S.auc.filter(a=>a.end<=now).forEach(a=>settle(a.id))}
}

const tileSel=(s,side)=>{const n=T()[side][keyOf(s)]||0;return `<div class="relative ${n?'sel':''}" data-a="tTog" data-p="${side}|${keyOf(s)}|${s.n}"><span class="cnt">${n}/${s.n}</span>${slab(cd(s.id),s.g)}</div>`};
A.tSel=async v=>{
  if(!v){S.T={to:'',toName:'',my:{},th:{},mac:0,tac:0,tinv:null};return render()}
  const s=await getDoc(doc(db,'users',v));if(!s.exists())return toast('Joueur introuvable');

};
A.tTog=p=>{const pt=p.split('|'),side=pt[0],k=pt[1]+'|'+pt[2],m=+pt[3],cur=S.T[side][k]||0;S.T[side][k]=cur+1>m?0:cur+1;render()};
A.tmac=v=>{S.T.mac=Math.max(0,+v||0);render()};A.ttac=v=>{S.T.tac=Math.max(0,+v||0);render()};
A.tSend=async()=>{
  const t=S.T,o=sel2list(t.my),w=sel2list(t.th);
  if(!o.length&&!t.mac&&!w.length&&!t.tac)return toast('La proposition est vide');
  if(t.mac>(U().ac||0))return toast('AnimeCoins insuffisants');
  await addDoc(collection(db,'trades'),{from:uid,fromName:U().name,to:t.to,toName:t.toName,offer:{cards:o,ac:t.mac},want:{cards:w,ac:t.tac},status:'pending',ts:Date.now()});
  notif(t.to,`🤝 ${U().name} t'a envoyé une proposition d'échange`,'trade');
  S.T={to:'',toName:'',my:{},th:{},mac:0,tac:0,tinv:null};toast('Proposition envoyée !');render();
};
A.tAcc=async id=>{
  let tt;
  try{
    await runTransaction(db,async tx=>{
      const tr=doc(db,'trades',id),t=(await tx.get(tr)).data();
      if(!t||t.status!=='pending')throw 'Échange déjà traité';if(t.to!==uid)throw 'Non autorisé';
      const fr=doc(db,'users',t.from),to=doc(db,'users',t.to),fs=await tx.get(fr),ts=await tx.get(to);
      const fi=cl(fs.data().inv||{}),ti=cl(ts.data().inv||{});let fa=fs.data().ac||0,ta=ts.data().ac||0;
      for(const c of t.offer.cards){if(!subC(fi,c.id,c.g,c.n))throw t.fromName+' ne possède plus ces cartes';addC(ti,c.id,c.g,c.n)}
      for(const c of t.want.cards){if(!subC(ti,c.id,c.g,c.n))throw 'Tu ne possèdes plus ces cartes';addC(fi,c.id,c.g,c.n)}
      fa+=t.want.ac-t.offer.ac;ta+=t.offer.ac-t.want.ac;if(fa<0||ta<0)throw 'AnimeCoins insuffisants';
      tx.update(fr,{inv:fi,ac:fa,val:invVal(fi)});tx.update(to,{inv:ti,ac:ta,val:invVal(ti)});tx.update(tr,{status:'accepted'});tt=t;
    });
    toast('Échange accepté !');notif(tt.from,`✅ ${tt.toName} a accepté ton échange !`,'trade');
  }catch(e){fail(e)}
};
A.tDec=async id=>{try{await updateDoc(doc(db,'trades',id),{status:'declined'})}catch(e){fail(e)}};

    let tid=null,tname='';

    if(q.docs.length){tid=q.docs[0].id;tname=q.docs[0].data().name}else{const d=await getDoc(doc(db,'users',n));if(d.exists()){tid=d.id;tname=d.data().name}}

    if((U().friends||[]).includes(tid))return toast('Vous êtes déjà amis');
    if((U().sent||[]).some(r=>r.uid===tid))return toast('Demande déjà envoyée');
    await updateDoc(doc(db,'users',tid),{reqs:arrayUnion({uid,name:U().name})});
    await saveU({sent:arrayUnion({uid:tid,name:tname})});
    notif(tid,`👥 ${U().name} t'a envoyé une demande d'ami`,'friend');

  if(n.length<3)return toast('Le nom du clan doit contenir au moins 3 caractères');
  try{
    const r=await addDoc(collection(db,'clans'),{name:n,tag,icon:S.cIcon||'⚔️',desc,privacy:S.cPriv||'open',owner:uid,members:[uid],pending:[],roles:{[uid]:'leader'},treasury:0,quests:{packs:0,coins:0,rares:0},ts:Date.now()});
    await saveU({clan:r.id,clanContributed:0});S.cForm={name:'',tag:'',desc:''};toast('Clan fondé avec succès !');
  }catch(e){fail(e)}
};
A.joinC=async id=>{
  const x=S.clans.find(c=>c.id===id);
  try{
    if(x?.privacy==='private'){
      await updateDoc(doc(db,'clans',id),{pending:arrayUnion({uid,name:U().name})});
      const staff=[x.owner,...Object.entries(x.roles||{}).filter(([,r])=>r==='officer').map(([k])=>k)];
      staff.forEach(s=>notif(s,`🛡️ ${U().name} demande à rejoindre le clan ${x.name}`,'clan'));
      toast('Demande envoyée aux responsables du clan');
    }else{
      await updateDoc(doc(db,'clans',id),{members:arrayUnion(uid)});await saveU({clan:id});toast('Tu as rejoint le clan !');
    }
  }catch(e){fail(e)}
};
A.cancelJoin=async id=>{try{await updateDoc(doc(db,'clans',id),{pending:arrayRemove({uid,name:U().name})});toast('Demande annulée')}catch(e){fail(e)}};
A.acceptJoin=async p=>{
  const [i,n]=p.split('|'),c=S.clan;if(!c)return;
  try{
    const us=await getDoc(doc(db,'users',i)),b=writeBatch(db),entry={uid:i,name:n};
    if(us.exists()&&us.data().clan&&us.data().clan!==c.id){b.update(doc(db,'clans',c.id),{pending:arrayRemove(entry)});await b.commit();return toast('Ce joueur a déjà rejoint un autre clan')}
    b.update(doc(db,'clans',c.id),{members:arrayUnion(i),pending:arrayRemove(entry)});b.update(doc(db,'users',i),{clan:c.id});
    await b.commit();notif(i,`✅ Ta candidature au clan ${c.name} a été acceptée !`,'clan');toast(n+' a rejoint le clan');
  }catch(e){fail(e)}
};
A.refuseJoin=async p=>{
  const [i,n]=p.split('|'),c=S.clan;if(!c)return;
  try{await updateDoc(doc(db,'clans',c.id),{pending:arrayRemove({uid:i,name:n})});notif(i,`❌ Ta candidature au clan ${c.name} a été refusée.`,'clan')}catch(e){fail(e)}
};
A.leaveC=async()=>{const id=U().clan;if(!id)return;await updateDoc(doc(db,'clans',id),{members:arrayRemove(uid)}).catch(()=>{});await saveU({clan:null});toast('Tu as quitté le clan.')};
A.donateC=async()=>{
  const amt=Math.max(0,+$('#donAmt')?.value||0),cid=U().clan;
  if(amt<10)return toast('Montant minimum : 10 AC');if((U().ac||0)<amt)return toast('AnimeCoins insuffisants');if(!cid)return;
  try{
    await runTransaction(db,async tx=>{
      const ur=ME(),cr=doc(db,'clans',cid),us=await tx.get(ur),cs=await tx.get(cr);
      if(!cs.exists())throw 'Clan introuvable';const uac=us.data().ac||0;if(uac<amt)throw 'AnimeCoins insuffisants';
      const cdt=cs.data(),q=cl(cdt.quests||{packs:0,coins:0,rares:0});q.coins=(q.coins||0)+amt;
      tx.update(ur,{ac:uac-amt,clanContributed:(us.data().clanContributed||0)+amt});tx.update(cr,{treasury:(cdt.treasury||0)+amt,quests:q});
    });
    toast(`Merci ! +${amt.toLocaleString()} AC versés au coffre du clan.`);
  }catch(e){fail(e)}
};
A.toggleOfficer=async t=>{if(!S.clan||S.clan.owner!==uid)return;const roles=cl(S.clan.roles||{});roles[t]=roles[t]==='officer'?'member':'officer';await updateDoc(doc(db,'clans',S.clan.id),{roles});toast('Rôle mis à jour')};
A.claimClanQ=async qid=>{
  if(!S.clan)return;const q=CLAN_QUESTS.find(x=>x.id===qid);if(!q)return;
  const cur=(S.clan.quests||{})[q.key]||0,key=S.clan.id+'_'+qid;
  if(cur<q.goal||(U().clanQuestsClaimed||[]).includes(key))return;
  await saveU({ac:(U().ac||0)+q.rew,earned:(U().earned||0)+q.rew,clanQuestsClaimed:arrayUnion(key)});toast(`Quête validée : +${q.rew} AC !`);
};
A.say=async()=>{const i=$('#cm'),t=i.value.trim();if(!t||!U().clan)return;i.value='';await addDoc(collection(db,'clans',U().clan,'chat'),{u:uid,name:U().name,t,ts:Date.now()}).catch(fail)};

/* ============ 15. SUCCÈS ============ */
function getAchList(){
  const u=U(),st=stacks(u.inv),distinct=Object.keys(u.inv||{}).length,hasLM=Object.keys(u.inv||{}).some(id=>['L','M'].includes(cd(id).rar));
  const tg=Math.max(u.gradedCount||0,st.filter(s=>s.g>0).reduce((a,s)=>a+s.n,0)),p10=st.filter(s=>s.g===10).reduce((a,s)=>a+s.n,0),claimed=u.ach||[];
  return [
    {id:'ach_pack1',title:'Premier Frisson',desc:'Ouvrir ton tout premier booster',cur:u.opened||0,goal:1,rew:100,icon:'🎴'},
    {id:'ach_pack25',title:'Ouverture en Série',desc:'Ouvrir 25 boosters au total',cur:u.opened||0,goal:25,rew:400,icon:'⚡'},
    {id:'ach_god',title:'Élu des Dieux',desc:'Obtenir une carte Légendaire ou Mythique',cur:hasLM?1:0,goal:1,rew:300,icon:'🌟'},
    {id:'ach_col50',title:'Collectionneur Aguerri',desc:'Posséder 50 cartes distinctes',cur:distinct,goal:50,rew:500,icon:'📚'},
    {id:'ach_col200',title:'Archiviste Suprême',desc:'Posséder 200 cartes distinctes',cur:distinct,goal:200,rew:1500,icon:'🏛️'},
    {id:'ach_grade5',title:'Expert Certifié',desc:'Faire grader ou posséder 5 cartes gradées PSA',cur:tg,goal:5,rew:250,icon:'🔎'},
    {id:'ach_psa10',title:'Chasseur de Gem Mint',desc:'Obtenir une carte PSA 10',cur:p10,goal:1,rew:1000,icon:'💎'},
    {id:'ach_rich',title:'Magnat des Affaires',desc:'Cumuler 5 000 AnimeCoins gagnés',cur:u.earned||0,goal:5000,rew:600,icon:'🪙'}
  ].map(d=>({...d,done:d.cur>=d.goal,claimed:claimed.includes(d.id),pct:Math.min(100,Math.round(d.cur/d.goal*100))}));
}
function vAch(){
  const list=getAchList(),dc=list.filter(x=>x.claimed).length;
  return `<div class="space-y-4"><div class="glass p-4 flex items-center justify-between flex-wrap gap-2"><div><h2 class="font-bold text-lg text-white">Succès & Trophées</h2><p class="text-xs text-slate-400">Accomplis des objectifs pour remporter des AnimeCoins</p></div><div class="px-3 py-1.5 rounded-lg bg-white/5 text-sm font-semibold text-indigo-300">Complétés : ${dc} / ${list.length}</div></div>
  <div class="grid sm:grid-cols-2 gap-3">${list.map(a=>`<div class="glass p-4 flex items-start gap-3.5 border ${a.done&&!a.claimed?'border-amber-400/50 bg-amber-500/[0.04]':'border-white/10'}"><div class="w-11 h-11 rounded-xl bg-white/5 flex items-center justify-center text-2xl shrink-0">${a.icon}</div>
  <div class="flex-1 min-w-0 space-y-1.5"><div class="flex items-center justify-between gap-2"><h3 class="font-bold text-sm text-white truncate">${a.title}</h3><span class="text-xs font-bold text-amber-300 shrink-0">+${a.rew} AC</span></div><p class="text-xs text-slate-400">${a.desc}</p>
  <div class="flex items-center gap-2 pt-1"><div class="flex-1 h-2 bg-white/10 rounded-full overflow-hidden"><div class="h-2 ${a.claimed?'bg-emerald-500':a.done?'bg-amber-400':'bg-indigo-500'}" style="width:${a.pct}%"></div></div><span class="text-[11px] text-slate-400 shrink-0">${Math.min(a.cur,a.goal).toLocaleString()} / ${a.goal.toLocaleString()}</span></div>
  <div class="pt-1">${a.claimed?'<span class="text-[11px] font-semibold text-emerald-400">✓ Récompense réclamée</span>':a.done?`<button class="btn text-xs py-1 px-3" data-a="claimAch" data-p="${a.id}">Réclamer +${a.rew} AC</button>`:`<span class="text-[11px] text-slate-500">En cours (${a.pct}%)</span>`}</div></div></div>`).join('')}</div></div>`;
}
A.claimAch=async id=>{const a=getAchList().find(x=>x.id===id);if(!a||!a.done||a.claimed)return;await saveU({ac:(U().ac||0)+a.rew,earned:(U().earned||0)+a.rew,ach:arrayUnion(id)});toast(`Succès « ${a.title} » débloqué : +${a.rew} AC !`)};

/* ============ 16. PROFIL ============ */
const BN=[['Ardoise','linear-gradient(90deg,#1e293b,#0f172a)'],['Indigo','linear-gradient(90deg,#312e81,#1e1b4b)'],['Émeraude','linear-gradient(90deg,#064e3b,#022c22)'],['Bordeaux','linear-gradient(90deg,#581c2e,#2a0f18)']];
const TI=['Recrue','Collectionneur','Chasseur de Mythiques','Maître des enchères','Gem Mint Hunter','Légende'];
const AV=['🦊','🐉','🥷','👾','🌸','⚡','🐺','🎴'];
function vProf(){
  const u=U(),st=stacks(u.inv),m=u.master&&u.inv?.[u.master]?u.master:'',g10=st.filter(s=>s.g===10).reduce((a,s)=>a+s.n,0),owned=Object.keys(u.inv||{}),muted=localStorage.ac_mute==='1';
  return `<div class="space-y-4"><div class="rounded-2xl p-4 sm:p-5 flex items-center gap-4 border border-white/10" style="background:${BN[u.banner||0][1]}">${avatarHTML(u,'w-16 h-16 text-3xl')}<div class="min-w-0"><h2 class="text-lg sm:text-xl font-extrabold text-white truncate">${E(u.name)}</h2><p class="text-xs sm:text-sm text-slate-300">${E(u.title)} — ${E(u.bio)}</p></div></div>
  <div class="grid md:grid-cols-2 gap-4"><div class="glass p-4 space-y-3 text-sm"><h3 class="font-bold text-white">Personnalisation</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><div><label class="block text-xs text-slate-400 mb-1">Pseudo</label><input class="w-full" value="${E(u.name)}" data-c="pName"></div><div><label class="block text-xs text-slate-400 mb-1">Titre</label><select class="w-full" data-c="pTitle">${TI.map(t=>`<option ${u.title===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
    <div><label class="block text-xs text-slate-400 mb-1">Biographie</label><input class="w-full" value="${E(u.bio)}" data-c="pBio"></div>
    <div><label class="block text-xs text-slate-400 mb-1">Bannière</label><select class="w-full" data-c="pBan">${BN.map((b,i)=>`<option value="${i}" ${(u.banner||0)===i?'selected':''}>Bannière ${b[0]}</option>`).join('')}</select></div>
    <div class="pt-2 border-t border-white/10 space-y-2"><label class="block text-xs font-semibold text-indigo-300">Photo de profil : choisir une carte possédée</label>
    <select class="w-full" data-c="pAvCard"><option value="">— Émoji classique —</option>${owned.map(id=>`<option value="${id}" ${u.avCard===id?'selected':''}>${E(cd(id).name)} (${R[cd(id).rar].n})</option>`).join('')}</select>
    <div class="flex gap-1.5 flex-wrap items-center"><span class="text-xs text-slate-400 mr-1">Ou émoji :</span>${AV.map(a=>`<button class="btn2 text-sm px-2 py-1" data-a="pAv" data-p="${a}">${a}</button>`).join('')}</div></div>
    <div class="pt-2 border-t border-white/10 space-y-2"><label class="block text-xs text-slate-400">Carte maîtresse exposée</label><select class="w-full" data-c="pMaster"><option value="">— Aucune —</option>${owned.map(id=>`<option value="${id}" ${m===id?'selected':''}>${E(cd(id).name)} (${R[cd(id).rar].n})</option>`).join('')}</select>${m?`<div class="w-36 pt-1">${card(cd(m))}</div>`:''}</div></div>
  <div class="glass p-4 space-y-3 text-sm h-fit"><h3 class="font-bold text-white">Statistiques</h3><div class="stats text-xs sm:text-sm">
    <p><span>Boosters ouverts</span><b>${(u.opened||0).toLocaleString()}</b></p><p><span>Cartes possédées (total)</span><b>${st.reduce((a,s)=>a+s.n,0).toLocaleString()}</b></p><p><span>Cartes distinctes</span><b>${owned.length.toLocaleString()}</b></p>
    <p><span>Valeur de revente de la collection</span><b class="text-amber-300">${invVal(u.inv).toLocaleString()} AC</b></p><p><span>AnimeCoins gagnés (cumul)</span><b>${(u.earned||0).toLocaleString()} AC</b></p><p><span>Cartes PSA 10</span><b class="text-indigo-300">${g10}</b></p>
    <p><span>Succès débloqués</span><b>${(u.ach||[]).length} / 8</b></p><p><span>Wishlist · Amis</span><b>${(u.wish||[]).length} · ${(u.friends||[]).length}</b></p></div>
    <h3 class="font-bold text-white pt-3">Paramètres</h3>
    <label class="flex gap-2 items-center text-xs cursor-pointer p-2 rounded bg-white/5"><input type="checkbox" ${u.nsfw?'checked':''} data-c="pNsfw"> Afficher le contenu 18+ / NSFW</label>
    <label class="flex gap-2 items-center text-xs cursor-pointer p-2 rounded bg-white/5"><input type="checkbox" ${muted?'':'checked'} data-c="pSound"> Effets sonores</label>
    <div class="flex gap-2 flex-wrap pt-2"><button class="btn2" data-a="exp">Exporter (JSON)</button><button class="btn2" data-a="clearCache">Vider le cache catalogue</button><button class="btn2 text-rose-300 border-rose-500/30" data-a="logout">Déconnexion</button></div></div></div></div>`;
}
A.pName=v=>{v=v.trim();if(v.length>=3)saveU({name:v,nameL:v.toLowerCase()})};
A.pBio=v=>saveU({bio:v});A.pTitle=v=>saveU({title:v});A.pAv=v=>saveU({av:v,avImg:'',avCard:''});
A.pAvCard=id=>{if(!id)return saveU({avImg:'',avCard:''});saveU({avImg:cd(id).img||'',avCard:id});toast('Photo de profil mise à jour !')};
A.pBan=v=>saveU({banner:+v});A.pMaster=v=>saveU({master:v});
A.pSound=(v,el)=>{localStorage.ac_mute=el.checked?'0':'1';if(el.checked)AU.flip()};
A.exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(U(),null,1)],{type:'application/json'}));a.download='animecards-save.json';a.click()};
A.clearCache=async()=>{if(confirm('Vider le cache du catalogue ? Il sera rechargé au prochain démarrage.')){await idbClear();location.reload()}};
A.pNsfw=async(v,el)=>{
  await saveU({nsfw:el.checked});
  if(el.checked&&!POOL.some(p=>p.adult)){
    toast('Chargement du catalogue 18+ en arrière-plan…');
    try{
      for(const j of ADJ){const rows=await fetchJob(j);rows.forEach(r=>BGMAP.set(r.id,r));await idbPut(rows);await sleep(1200)}
      refresh();toast('Contenu 18+ activé');
    }catch(e){fail(e)}
  }
};

boot().catch(e=>showErr(e.message||e));
</script>
</body>
</html>
