@keyframes fL{50%{box-shadow:0 0 64px 14px rgba(234,179,8,.55)}}@keyframes fM{33%{box-shadow:0 0 80px 18px rgba(244,114,182,.55)}66%{box-shadow:0 0 80px 18px rgba(96,165,250,.55)}}
.fx-C{animation:fl .3s}.fx-R{animation:fl .35s,fR .9s}.fx-E{animation:fl .4s,fE 1.1s}.fx-L{animation:fl .45s,fL 1.4s}.fx-M{animation:fl .5s,fM 2s}
.scan{position:absolute;left:0;right:0;height:2px;background:#818cf8;box-shadow:0 0 12px #818cf8;animation:sc 1s ease-in-out infinite alternate;z-index:5}@keyframes sc{from{top:0}to{top:100%}}
.tab{padding:.4rem .75rem;border-radius:8px;white-space:nowrap;color:#a1a1aa;font-weight:500;transition:.15s}.tab:hover{color:#fff}.tab.on{background:rgba(255,255,255,.1);color:#fff}
.sel{outline:2px solid #6366f1;outline-offset:2px;border-radius:12px}
.stats p{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:.4rem 0}

async function gql(q,v){for(let i=0;i<5;i++){const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:q,variables:v})});

 const d=await gql(QM,{p,t:k==='a'?'ANIME':'MANGA',a});return d.media.map(x=>({id:k+x.id,kind:k,name:x.title.english||x.title.romaji,img:x.coverImage?.extraLarge||'',fav:x.favourites,job,adult:a}))}

function rarify(all){assign(all.filter(x=>x.kind==='c'&&!x.adult));assign(all.filter(x=>x.kind!=='c'&&!x.adult));assign(all.filter(x=>x.adult))}

async function loadPool(jobs,all){const done=new Set(all.map(x=>x.job));const todo=jobs.filter(j=>!done.has(j));
 for(let i=0;i<todo.length;i++){prog(jobs.length-todo.length+i,jobs.length,`Chargement du catalogue AniList : ${all.length} cartes`);
  let rows;for(let t=0;t<3;t++){try{rows=await fetchJob(todo[i]);break}catch(e){if(t==2)throw e;await sleep(2000)}}
  all.push(...rows);await idbPut(rows);await sleep(1000)}
 if(todo.length){rarify(all);await idbPut(all)}reg(all);return all}

/* ============ Cartes ============ */
const cd=id=>PM.get(id)||{id,name:'Carte inconnue',img:'',rar:'C',kind:'c',fav:0};
const val=(id,g)=>Math.round(R[cd(id).rar].v*(g?gm(g):1)),sellP=(id,g)=>Math.max(1,Math.round(val(id,g)*.3));
function card(c,g=0){return `<div class="card tilt r-${c.rar}" style="--hue:${hue(c.id)}"><div class="art"><b>${E(c.name[0])}</b>${c.img?`<img src="${E(c.img)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">`:''}</div><div class="shine"></div><span class="rl">${R[c.rar].n}</span><span class="tp ${c.kind==='c'?'':'f'}">${c.kind==='c'?'[PERSONNAGE]':'[FRANCHISE]'}</span><div class="nm">${E(c.name)}<small>${val(c.id,g)} AC</small></div></div>`}

/* inventaire : { cardId: {q: copies non gradées, g:[notes des copies gradées]} } */
const cnt=(inv,id,g)=>g?(inv[id]?.g||[]).filter(x=>x===g).length:(inv[id]?.q||0);
const addC=(inv,id,g,n=1)=>{const o=inv[id]||(inv[id]={q:0,g:[]});if(g)for(let i=0;i<n;i++)o.g.push(g);else o.q+=n};

const stacks=inv=>{const r=[];for(const id in inv||{}){if(inv[id].q)r.push({id,g:0,n:inv[id].q});const m={};(inv[id].g||[]).forEach(x=>m[x]=(m[x]||0)+1);for(const g in m)r.push({id,g:+g,n:m[g]})}return r};

<input id="aid" class="w-full" placeholder="Pseudo ou email"><input id="apw" type="password" class="w-full" placeholder="Mot de passe (6 caractères min.)">

A.login=async()=>{try{await signInWithEmailAndPassword(auth,mail($('#aid').value.trim()),$('#apw').value)}catch(e){fail('Connexion impossible : '+e.code)}};
A.register=async()=>{const id=$('#aid').value.trim();if(id.length<3)return toast('Pseudo trop court');
 try{const c=await createUserWithEmailAndPassword(auth,mail(id),$('#apw').value),name=id.split('@')[0];
 await setDoc(doc(db,'users',c.user.uid),{name,nameL:name.toLowerCase(),bio:'Chasseur de cartes',title:'Recrue',av:'🦊',banner:0,ac:500,earned:0,packs:10,last:Date.now(),inv:{},val:0,wish:[],friends:[],reqs:[],opened:0,albums:{},master:'',nsfw:false,clan:null,seen:Date.now(),daily:0})}catch(e){fail('Inscription impossible : '+e.code)}};
A.logout=()=>signOut(auth);

/* ============ Démarrage ============ */
async function boot(){const cfg=getCfg();if(!cfg)return setupScr();
 scr(`<div class="glass p-6 w-full max-w-md text-center space-y-3"><h2 class="text-xl font-bold">Préparation du catalogue</h2><div class="h-3 bg-white/10 rounded"><div id="pb" class="h-3 rounded bg-indigo-500" style="width:0"></div></div><p id="pm" class="text-sm opacity-70">Lecture du cache…</p><p class="text-xs opacity-50">Premier lancement uniquement (environ 1 à 2 minutes) : les 2000 cartes sont ensuite conservées dans IndexedDB.</p></div>`);
 let all=await idbAll();try{all=await loadPool(JOBS,all)}catch(e){reg(all.filter(x=>x.rar));if(POOL.length<60){return scr(`<div class="glass p-6 max-w-md text-center space-y-3"><p>${E(e.message)}</p><button class="btn" onclick="location.reload()">Réessayer</button></div>`)}toast('Catalogue partiel : '+POOL.length+' cartes')}
 reg(all.filter(x=>x.rar));
 try{await loadFB()}catch(e){return showErr('Impossible de charger Firebase (réseau ou blocage du navigateur) : '+(e.message||e))}
 try{const app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app)}catch(e){return setupScr()}
 onAuthStateChanged(auth,async u=>{if(!u){window.__ac=2;uid=null;Object.keys(UN).forEach(k=>{UN[k]?.();delete UN[k]});$('#app').classList.add('hidden');return authScr()}window.__ac=2;uid=u.uid;hideScr();$('#app').classList.remove('hidden');start()})}

function start(){
 sub('u',onSnapshot(ME(),s=>{if(!s.exists())return;const first=!S.u;S.u=s.data();head();soft();if(first||S.frKey!==(S.u.friends||[]).join())subFriends();if(first||S.cid!==S.u.clan)subClan()}));
 sub('n',onSnapshot(query(collection(db,'users',uid,'notifs'),orderBy('ts','desc'),limit(30)),s=>{S.notifs=s.docs.map(d=>({id:d.id,...d.data()}));head()}));
 let firstA=true;
 sub('a',onSnapshot(query(collection(db,'auctions'),where('status','==','open')),s=>{S.auc=s.docs.map(d=>({id:d.id,...d.data()}));
  if(!firstA)s.docChanges().forEach(ch=>{const a=ch.doc.data();if(ch.type==='added'&&a.seller!==uid&&(U().wish||[]).includes(a.card))notif(uid,`❤️ Wishlist : ${cd(a.card).name} est aux enchères (par ${a.sellerName}) !`)});firstA=false;if(S.tab==='auc')soft()}));
 sub('tin',onSnapshot(query(collection(db,'trades'),where('to','==',uid)),s=>{S.trIn=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==='trade')soft()}));
 sub('tout',onSnapshot(query(collection(db,'trades'),where('from','==',uid)),s=>{S.trOut=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==='trade')soft()}));
 sub('clans',onSnapshot(query(collection(db,'clans'),limit(30)),s=>{S.clans=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==='soc')soft()}));
 sub('hb',(()=>{const i=setInterval(()=>saveU({seen:Date.now()}).catch(()=>{}),60000);return()=>clearInterval(i)})());saveU({seen:Date.now()});
 sub('tick',(()=>{const i=setInterval(tick,1000);return()=>clearInterval(i)})())}
function subFriends(){const f=(U().friends||[]);S.frKey=f.join();if(!f.length){S.fr={};sub('fr',()=>{});return soft()}
 sub('fr',onSnapshot(query(collection(db,'users'),where(documentId(),'in',f.slice(0,30))),s=>{S.fr=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));if(['soc','trade'].includes(S.tab))soft()}))}
function subClan(){const c=S.cid=U().clan;if(!c){S.clan=null;S.cmem=[];sub('cl',()=>{});sub('cm',()=>{});sub('cc',()=>{});return soft()}
 sub('cl',onSnapshot(doc(db,'clans',c),s=>{S.clan=s.exists()?{id:s.id,...s.data()}:null;if(S.tab==='soc')soft()}));
 sub('cm',onSnapshot(query(collection(db,'users'),where('clan','==',c)),s=>{S.cmem=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==='soc')soft()}));
 sub('cc',onSnapshot(query(collection(db,'clans',c,'chat'),orderBy('ts','desc'),limit(50)),s=>{S.chat=s.docs.map(d=>d.data()).reverse();const l=$('#chatlog');if(l){l.innerHTML=chatH();l.scrollTop=1e9}}))}

/* ============ Shell ============ */
const TABS=[['packs','🎴 Packs'],['col','📚 Collection'],['grade','🔎 Gradation'],['codex','🌐 Codex'],['auc','🔨 Enchères'],['trade','🤝 Échanges'],['soc','👥 Social'],['prof','👤 Profil']];
function head(){if(!S.u)return;$('#ac').textContent=S.u.ac.toLocaleString();const n=S.notifs.filter(x=>!x.read).length;$('#bd').textContent=n||'';
 $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" data-a="go" data-p="${k}">${l}</button>`).join('');
 $('#nt').innerHTML=S.notifs.map(n=>`<div class="p-1 border-b border-white/10 ${n.read?'opacity-50':''}">${E(n.t)}<div class="opacity-40">${new Date(n.ts).toLocaleTimeString()}</div></div>`).join('')||'Aucune notification'}
A.bell=()=>{const n=$('#nt');n.classList.toggle('hidden');if(n.classList.contains('hidden')){const b=writeBatch(db);S.notifs.filter(x=>!x.read).forEach(x=>b.update(doc(db,'users',uid,'notifs',x.id),{read:true}));b.commit().catch(()=>{})}};
A.go=t=>{S.tab=t;render()};
const VIEWS=()=>({packs:vPacks,col:vCol,grade:vGrade,codex:vCodex,auc:vAuc,trade:vTrade,soc:vSoc,prof:vProf});
function render(){if(!S.u)return;head();$('#main').innerHTML=VIEWS()[S.tab]();if(S.tab==='codex')fillCodex();if(S.tab==='soc'){const l=$('#chatlog');if(l)l.scrollTop=1e9}}
const soft=()=>{head();if(S.busy||document.activeElement?.matches?.('#main input,#main select,#main textarea'))return;render()};
function modal(h,keep){const o=$('#ov');o.innerHTML=h;o.classList.remove('hidden');o.onclick=e=>{if(e.target===o&&!keep)closeM()}}
const closeM=()=>{$('#ov').classList.add('hidden');$('#ov').innerHTML=''};A.close=closeM;
A.daily=async()=>{const l=U().daily||0;if(Date.now()-l<864e5)return toast('Bonus déjà réclamé : reviens dans '+Math.ceil((864e5-(Date.now()-l))/36e5)+' h');await saveU({daily:Date.now(),ac:U().ac+300,earned:(U().earned||0)+300});toast('+300 AC !')};

/* ============ Packs ============ */
function curPacks(){let p=U().packs,l=U().last||Date.now();const n=Date.now();while(p<10&&n-l>=3e5){p++;l+=3e5}if(p>=10)l=n;return{p,l}}
function vPacks(){const{p}=curPacks();return `<div class="text-center space-y-4 py-6"><div class="pack" data-a="openPack">ANIME<br>CARDS<br>⚡</div><p class="text-xl">Packs : <b id="pk">${p}</b>/10</p><p class="opacity-70">Prochain pack dans <b id="cd"></b></p>
<button class="btn text-lg" data-a="openPack" ${p<1?'disabled':''}>Ouvrir un pack (5 cartes)</button><p class="text-xs opacity-60">Commune 50% · Rare 30% · Épique 14% · Légendaire 5% · Mythique 1% — catalogue : ${POOL.length} cartes</p></div>`}
A.openPack=async()=>{if(S.P)return;const{p,l}=curPacks();if(p<1)return toast('Aucun pack disponible');
 const cs=[...Array(5)].map(draw).sort((a,b)=>RO.indexOf(cd(a).rar)-RO.indexOf(cd(b).rar));/* ordre croissant : la plus rare en dernier */
 const inv=cl(U().inv||{});cs.forEach(id=>addC(inv,id,0));S.P={cs,i:0,tear:0,flip:0};pov();
 try{await saveInv(inv,{packs:p-1,last:l,opened:(U().opened||0)+1})}catch(e){S.P=null;closeM();fail(e)}};
function pov(){const P=S.P;if(!P.tear)return modal('<div class="text-center"><div class="pack" id="pk1" data-a="tear">Clique pour déchirer</div></div>',1);
 const c=cd(P.cs[P.i]),hi=c.rar==='L'||c.rar==='M';
 modal(`<div class="text-center w-56 sm:w-64"><div class="relative" data-a="nextC">${P.flip?`<div class="relative fx-${c.rar}">${card(c)}</div>`:'<div class="card back">✦</div>'}</div><p class="mt-4 opacity-70">${P.i+1}/5 — ${P.flip?(P.i<4?'Clique pour la suivante':'Clique pour terminer'):'Clique pour révéler'}</p></div>`,1)}
A.tear=()=>{$('#pk1').classList.add('torn');setTimeout(()=>{S.P.tear=1;pov()},550)};
A.nextC=()=>{const P=S.P;if(!P.flip){P.flip=1;return pov()}if(P.i<4){P.i++;P.flip=0;return pov()}S.P=null;closeM();render()};

/* ============ Collection & albums ============ */
const keyOf=s=>s.id+'|'+s.g,parse=k=>{const[i,g]=k.split('|');return{id:i,g:+g}};
function filtered(){const F=S.F,al=F.a?(U().albums||{})[F.a]||[]:null;return stacks(U().inv).filter(s=>{const c=cd(s.id);if(F.q&&!c.name.toLowerCase().includes(F.q.toLowerCase()))return;if(F.r&&c.rar!==F.r)return;if(F.g==='g'&&!s.g)return;if(F.g==='u'&&s.g)return;if(F.d&&s.n<2)return;if(al&&!al.includes(keyOf(s)))return;return 1}).sort((a,b)=>RO.indexOf(cd(b.id).rar)-RO.indexOf(cd(a.id).rar)||b.g-a.g)}
function vCol(){const F=S.F;return `<div class="flex flex-wrap gap-2 mb-4 items-center"><input placeholder="Rechercher…" value="${E(F.q)}" data-i="fq">
<select data-c="fr"><option value="">Raretés</option>${RO.map(k=>`<option value="${k}" ${F.r===k?'selected':''}>${R[k].n}</option>`)}</select>
<select data-c="fg"><option value="">Gradation</option><option value="g" ${F.g=='g'?'selected':''}>Gradées</option><option value="u" ${F.g=='u'?'selected':''}>Non gradées</option></select>
<select data-c="fa"><option value="">Tous albums</option>${Object.keys(U().albums||{}).map(a=>`<option ${F.a===a?'selected':''}>${E(a)}</option>`)}</select>
<label class="text-sm"><input type="checkbox" ${F.d?'checked':''} data-c="fd"> Doublons</label><button class="btn2" data-a="newAlbum">＋ Album</button><button class="btn2" data-a="sellDup">♻ Vendre les doublons</button></div>
<p id="cn" class="mb-2 text-sm opacity-70"></p><div id="grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3"></div>${setTimeout(colUpd)&&''}`}
function colUpd(){const L=filtered();$('#cn').textContent=`${L.length} carte(s) distinctes · valeur totale ${(U().val||0).toLocaleString()} AC`;$('#grid').innerHTML=L.map(s=>tile(s,'show')).join('')||'<p class="col-span-full opacity-60">Aucune carte.</p>'}
A.fq=v=>{S.F.q=v;colUpd()};A.fr=v=>{S.F.r=v;colUpd()};A.fg=v=>{S.F.g=v;colUpd()};A.fa=v=>{S.F.a=v;colUpd()};A.fd=(v,el)=>{S.F.d=el.checked;colUpd()};
A.newAlbum=()=>{const n=prompt('Nom du nouvel album :');if(n&&!(U().albums||{})[n])saveU({['albums.'+n.replace(/\./g,'_')]:[]})};
A.sellDup=async()=>{const inv=cl(U().inv||{});let g=0,n=0;for(const id in inv){const q=inv[id].q;if(q>1){g+=(q-1)*sellP(id,0);n+=q-1;inv[id].q=1}}if(!n)return toast('Aucun doublon à vendre');await saveInv(inv,{ac:U().ac+g,earned:(U().earned||0)+g});toast(`${n} doublon(s) vendus : +${g} AC`)};
A.show=k=>{const{id,g}=parse(k),n=cnt(U().inv||{},id,g);if(!n)return;const c=cd(id),w=(U().wish||[]).includes(id);
 modal(`<div class="glass bg-[#14161d] p-4 flex gap-4 flex-wrap max-w-lg justify-center"><div class="w-48 relative">${n>1?`<span class="cnt">x${n}</span>`:''}${slab(c,g)}</div><div class="space-y-2 text-sm w-52"><h3 class="font-bold text-lg">${E(c.name)}</h3><p>${R[c.rar].n} · ${c.kind==='c'?'Personnage':'Franchise'}</p><p>Valeur : <b>${val(id,g)} AC</b></p>
 <button class="btn w-full" data-a="sell1" data-p="${k}">Vendre 1 (${sellP(id,g)} AC)</button>
 ${g?'':`<button class="btn2 w-full" data-a="toGrade" data-p="${k}">Faire grader</button>`}
 <button class="btn2 w-full" data-a="listForm" data-p="${k}">Mettre aux enchères</button>
 <button class="btn2 w-full" data-a="wish" data-p="${id}">${w?'💔 Retirer de':'❤️ Ajouter à'} la wishlist</button>
 <button class="btn2 w-full" data-a="master" data-p="${id}">⭐ Carte maîtresse</button>
 <select class="w-full" data-c="toAlbum" data-p="${k}"><option value="">Ajouter à un album…</option>${Object.keys(U().albums||{}).map(a=>`<option>${E(a)}</option>`)}</select>
 <button class="btn2 w-full" data-a="close">Fermer</button></div></div>`)};
A.toAlbum=async(a,el)=>{if(!a)return;const k=el.dataset.p,al=cl(U().albums||{});al[a]=[...new Set([...(al[a]||[]),k])];await saveU({albums:al});toast('Ajoutée à '+a)};
A.sell1=async k=>{const{id,g}=parse(k),inv=cl(U().inv||{});if(!subC(inv,id,g))return;const p=sellP(id,g);await saveInv(inv,{ac:U().ac+p,earned:(U().earned||0)+p});toast('+'+p+' AC');if(cnt(inv,id,g))A.show(k);else closeM()};
A.wish=async id=>{const w=(U().wish||[]).includes(id);await saveU({wish:w?arrayRemove(id):arrayUnion(id)});if(S.tab==='codex')fillCodex();else if(!$('#ov').classList.contains('hidden'))A.show(id+'|0')};
A.master=async id=>{await saveU({master:id});toast('Carte maîtresse définie')};
A.toGrade=k=>{S.G=k;closeM();A.go('grade')};

/* ============ Gradation ============ */
function vGrade(){const L=stacks(U().inv).filter(s=>!s.g),sel=S.G&&L.find(s=>keyOf(s)===S.G);
 return `<div class="grid md:grid-cols-3 gap-4"><div class="glass p-4 text-center space-y-3"><h2 class="font-bold">Atelier de gradation</h2>
 ${sel?`<div id="gc" class="relative w-44 mx-auto">${card(cd(sel.id))}</div><p class="text-sm">Coût : <b>100 AC</b> · une note de 9 ou 10 multiplie fortement la valeur</p><button class="btn" data-a="gradeIt" ${U().ac<100?'disabled':''}>Lancer l'expertise</button>`:'<p class="opacity-60 py-10">Sélectionne une carte non gradée →</p>'}</div>
 <div class="md:col-span-2 grid grid-cols-3 sm:grid-cols-4 gap-3 content-start">${L.map(s=>tile(s,'pickG',S.G===keyOf(s))).join('')||'<p class="opacity-60">Aucune carte à grader.</p>'}</div></div>`}
A.pickG=k=>{S.G=k;render()};
A.gradeIt=async()=>{const{id}=parse(S.G),inv=cl(U().inv||{});if(U().ac<100||!subC(inv,id,0))return;let r=Math.random()*100,g=1;for(;g<10;g++){if((r-=GW[g])<0)break}
 addC(inv,id,g);S.busy=true;$('#gc').insertAdjacentHTML('beforeend','<div class="scan"></div>');await saveInv(inv,{ac:U().ac-100});
 setTimeout(()=>{S.busy=false;S.G=null;modal(`<div class="text-center space-y-3 w-60"><h3 class="text-2xl font-bold">${g} — ${GN[g]}</h3>${slab(cd(id),g)}<p>Nouvelle valeur : <b>${val(id,g)} AC</b></p><button class="btn" data-a="close">Super !</button></div>`);render()},2500)};

/* ============ Codex & wishlist ============ */
const vCodex=()=>`<div class="flex gap-2 mb-4 flex-wrap items-center"><input placeholder="Rechercher…" value="${E(S.CQ)}" data-i="cq"><select data-c="crr"><option value="">Toutes raretés</option>${RO.map(k=>`<option value="${k}" ${S.CR===k?'selected':''}>${R[k].n}</option>`)}</select><label class="text-sm"><input type="checkbox" ${S.CW?'checked':''} data-c="cw"> Wishlist</label><span class="text-sm opacity-60" id="cc"></span></div><div id="cg" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3"></div><div class="text-center mt-4"><button class="btn2" data-a="moreC">Afficher plus</button></div>`;
A.cq=v=>{S.CQ=v;S.CN=90;fillCodex()};A.crr=v=>{S.CR=v;fillCodex()};A.cw=(v,el)=>{S.CW=el.checked;fillCodex()};A.moreC=()=>{S.CN+=90;fillCodex()};
function fillCodex(){const inv=U().inv||{},w=U().wish||[];const L=avail().filter(p=>(!S.CQ||p.name.toLowerCase().includes(S.CQ.toLowerCase()))&&(!S.CR||p.rar===S.CR)&&(!S.CW||w.includes(p.id))).sort((a,b)=>RO.indexOf(b.rar)-RO.indexOf(a.rar)||b.fav-a.fav);
 $('#cc').textContent=`${avail().filter(p=>inv[p.id]).length}/${avail().length} possédées`;
 $('#cg').innerHTML=L.slice(0,S.CN).map(p=>`<div class="relative"><div class="${inv[p.id]?'':'grayscale opacity-50'}">${card(p)}</div><button class="absolute bottom-10 right-1 text-xl" data-a="wish" data-p="${p.id}">${w.includes(p.id)?'❤️':'🤍'}</button></div>`).join('')||'<p>Aucune carte.</p>'}

/* ============ Enchères (Firestore temps réel) ============ */
const vAuc=()=>`<div class="flex items-center gap-3 mb-4"><h2 class="font-bold text-lg">Hôtel des enchères</h2><button class="btn2" data-a="listForm">Vendre une de mes cartes</button></div>
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">${S.auc.sort((a,b)=>a.end-b.end).map(a=>`<div class="glass p-3 space-y-2 text-xs">${slab(cd(a.card),a.grade)}<div>Vendeur : ${a.seller===uid?'toi':E(a.sellerName)}</div><div>Mise : <b>${a.bid} AC</b> ${a.bidder===uid?'(toi)':a.bidderName?'('+E(a.bidderName)+')':''}</div><div>⏱ <b data-end="${a.end}"></b></div>
 ${a.seller===uid?'<div class="opacity-60">Ta vente</div>':`<div class="flex gap-1"><input id="b${a.id}" type="number" class="w-16" value="${a.bidder?Math.ceil(a.bid*1.1)+1:a.bid}"><button class="btn2" data-a="bid" data-p="${a.id}">Surenchérir</button></div>`}</div>`).join('')||'<p class="opacity-70 col-span-full">Aucune enchère en cours : mets une carte en vente !</p>'}</div>`;
A.bid=async aid=>{const v=+$('#b'+aid).value;let prev=null,nm='';try{await runTransaction(db,async tx=>{const ar=doc(db,'auctions',aid),a=(await tx.get(ar)).data();if(!a||a.status!=='open'||a.end<=Date.now())throw 'Enchère terminée';if(a.seller===uid)throw 'Impossible de miser sur ta vente';if(v<=a.bid&&a.bidder||v<a.bid)throw 'Mise trop basse';
 const mr=ME(),ms=await tx.get(mr);let ac=ms.data().ac,pr,ps;if(a.bidder&&a.bidder!==uid){pr=doc(db,'users',a.bidder);ps=await tx.get(pr)}if(a.bidder===uid)ac+=a.bid;if(ac<v)throw 'AnimeCoins insuffisants';
 tx.update(mr,{ac:ac-v});if(ps)tx.update(pr,{ac:ps.data().ac+a.bid});tx.update(ar,{bid:v,bidder:uid,bidderName:U().name});prev=ps?a.bidder:null;nm=cd(a.card).name});
 toast('Mise placée');if(prev)notif(prev,`⚠️ ${U().name} a surenchéri sur ${nm} (${v} AC) — ta mise est remboursée`)}catch(e){fail(e)}};
A.listForm=k=>{closeM();const L=stacks(U().inv);if(!L.length)return toast('Aucune carte');
 modal(`<div class="glass bg-[#14161d] p-4 space-y-2 text-sm"><h3 class="font-bold">Mettre aux enchères (1 exemplaire)</h3><select id="lc" class="w-full">${L.map(s=>`<option value="${keyOf(s)}" ${keyOf(s)===k?'selected':''}>${E(cd(s.id).name)} (${R[cd(s.id).rar].n}${s.g?' '+s.g+'/10':''}) x${s.n}</option>`)}</select>
 <div>Prix de départ <input id="lp" type="number" value="20" class="w-24"> AC</div><div>Durée <select id="ld"><option value="60">1 min</option><option value="300">5 min</option><option value="3600">1 h</option><option value="86400">24 h</option></select></div><button class="btn w-full" data-a="listIt">Publier</button></div>`)};
A.listIt=async()=>{const{id,g}=parse($('#lc').value),price=Math.max(1,+$('#lp').value||1),dur=+$('#ld').value;
 try{await runTransaction(db,async tx=>{const us=await tx.get(ME()),inv=cl(us.data().inv||{});if(!subC(inv,id,g))throw 'Carte indisponible';tx.update(ME(),{inv,val:invVal(inv)});
 tx.set(doc(collection(db,'auctions')),{card:id,grade:g,seller:uid,sellerName:U().name,bid:price,bidder:null,bidderName:'',end:Date.now()+dur*1000,status:'open'})});closeM();A.go('auc')}catch(e){fail(e)}};
async function settle(aid){try{let info;await runTransaction(db,async tx=>{const ar=doc(db,'auctions',aid),a=(await tx.get(ar)).data();info=null;if(!a||a.status!=='open'||a.end>Date.now())return;
 const sr=doc(db,'users',a.seller),ss=await tx.get(sr);let br,bs;if(a.bidder){br=doc(db,'users',a.bidder);bs=await tx.get(br)}
 if(a.bidder){const si=ss.data();tx.update(sr,{ac:si.ac+a.bid,earned:(si.earned||0)+a.bid});const inv=cl(bs.data().inv||{});addC(inv,a.card,a.grade);tx.update(br,{inv,val:invVal(inv)})}
 else{const inv=cl(ss.data().inv||{});addC(inv,a.card,a.grade);tx.update(sr,{inv,val:invVal(inv)})}
 tx.update(ar,{status:'closed'});info=a});
 if(info){const n=cd(info.card).name;if(info.bidder){notif(info.bidder,`🏆 Tu as remporté ${n} pour ${info.bid} AC`);notif(info.seller,`💰 ${n} vendu ${info.bid} AC à ${info.bidderName}`)}else notif(info.seller,`${n} n'a pas trouvé preneur : carte restituée`)}}catch(e){}}
function tick(){const now=Date.now();const cd2=$('#cd');if(cd2&&S.u){const{p,l}=curPacks();cd2.textContent=p>=10?'— (stock plein)':fmt((3e5-(now-l))/1e3);$('#pk').textContent=p}
 document.querySelectorAll('[data-end]').forEach(e=>e.textContent=fmt(Math.max(0,(e.dataset.end-now)/1e3)));
 if(now-(tick.s||0)>5000){tick.s=now;S.auc.filter(a=>a.end<=now).forEach(a=>settle(a.id))}}

/* ============ Échanges (trades) ============ */
const T=()=>S.T,sel2list=(m)=>Object.entries(m).filter(([,n])=>n>0).map(([k,n])=>({...parse(k),n}));
const sv=l=>l.reduce((a,c)=>a+val(c.id,c.g)*c.n,0),cdesc=l=>l.map(c=>`${E(cd(c.id).name)}${c.g?' ('+c.g+'/10)':''} x${c.n}`).join(', ')||'—';
function vTrade(){const t=T(),fr=Object.entries(S.fr),mine=stacks(U().inv);
 const row=x=>`<div class="glass p-3 mb-2 text-sm"><b>${E(x.fromName)}</b> → <b>${E(x.toName)}</b> : <span class="text-emerald-300">${cdesc(x.offer.cards)}${x.offer.ac?' + '+x.offer.ac+' AC':''}</span> contre <span class="text-rose-300">${cdesc(x.want.cards)}${x.want.ac?' + '+x.want.ac+' AC':''}</span> <i>[${x.status}]</i>
 ${x.status==='pending'&&x.to===uid?`<button class="btn2" data-a="tAcc" data-p="${x.id}">Accepter</button> <button class="btn2" data-a="tDec" data-p="${x.id}">Refuser</button>`:''}${x.status==='pending'&&x.from===uid?`<button class="btn2" data-a="tDec" data-p="${x.id}">Annuler</button>`:''}</div>`;
 const all=[...S.trIn,...S.trOut].sort((a,b)=>b.ts-a.ts).slice(0,12);
 return `<div class="mb-4"><h3 class="font-bold mb-2">Offres & historique</h3>${all.map(row).join('')||'<p class="text-sm opacity-60">Aucun échange.</p>'}</div>
 <div class="flex items-center gap-2 mb-3 flex-wrap">Nouvel échange avec <select data-c="tSel"><option value="">— ami —</option>${fr.map(([i,f])=>`<option value="${i}" ${t.to===i?'selected':''}>${E(f.name)} ${online(f)?'🟢':'⚫'}</option>`)}</select>${fr.length?'':'<span class="text-sm opacity-60">Ajoute des amis dans l\'onglet Social.</span>'}</div>
 ${t.to&&t.tinv?`<div class="grid md:grid-cols-2 gap-4"><div class="glass p-3"><h3 class="font-bold mb-2">Mon offre</h3><div class="grid grid-cols-3 gap-2 max-h-72 overflow-auto">${mine.map(s=>tileSel(s,'my')).join('')}</div><p class="mt-2 text-sm">+ AnimeCoins <input type="number" min="0" value="${t.mac}" class="w-24" data-c="tmac"></p></div>
 <div class="glass p-3"><h3 class="font-bold mb-2">Offre de ${E(t.toName)}</h3><div class="grid grid-cols-3 gap-2 max-h-72 overflow-auto">${stacks(t.tinv).map(s=>tileSel(s,'th')).join('')||'<p class="text-sm opacity-60">Inventaire vide.</p>'}</div><p class="mt-2 text-sm">+ AnimeCoins <input type="number" min="0" value="${t.tac}" class="w-24" data-c="ttac"></p></div></div>
 <div class="glass p-3 mt-4 flex flex-wrap gap-4 items-center"><span>Tu donnes : <b>${sv(sel2list(t.my))+t.mac} AC</b></span><span>Tu reçois : <b>${sv(sel2list(t.th))+t.tac} AC</b></span><button class="btn" data-a="tSend">Envoyer la proposition</button></div>`:''}`}
const tileSel=(s,side)=>{const n=T()[side][keyOf(s)]||0;return `<div class="relative ${n?'sel':''}" data-a="tTog" data-p="${side}|${keyOf(s)}|${s.n}"><span class="cnt">${n}/${s.n}</span>${slab(cd(s.id),s.g)}</div>`};
A.tSel=async v=>{if(!v){S.T={to:'',toName:'',my:{},th:{},mac:0,tac:0,tinv:null};return render()}const s=await getDoc(doc(db,'users',v));S.T={to:v,toName:s.data().name,my:{},th:{},mac:0,tac:0,tinv:s.data().inv||{}};render()};
A.tTog=p=>{const[side,k,m]=p.split('|').length>3?[p.split('|')[0],p.split('|').slice(1,3).join('|'),p.split('|')[3]]:p.split('|');const cur=S.T[side][k]||0;S.T[side][k]=cur+1>+m?0:cur+1;render()};
A.tmac=v=>{S.T.mac=Math.max(0,+v||0);render()};A.ttac=v=>{S.T.tac=Math.max(0,+v||0);render()};
A.tSend=async()=>{const t=S.T,o=sel2list(t.my),w=sel2list(t.th);if(!o.length&&!t.mac&&!w.length&&!t.tac)return toast('Proposition vide');if(t.mac>U().ac)return toast('AnimeCoins insuffisants');
 await addDoc(collection(db,'trades'),{from:uid,fromName:U().name,to:t.to,toName:t.toName,offer:{cards:o,ac:t.mac},want:{cards:w,ac:t.tac},status:'pending',ts:Date.now()});notif(t.to,`🤝 ${U().name} te propose un échange`);S.T={to:'',toName:'',my:{},th:{},mac:0,tac:0,tinv:null};toast('Proposition envoyée');render()};
A.tAcc=async id=>{let tt;try{await runTransaction(db,async tx=>{const tr=doc(db,'trades',id),t=(await tx.get(tr)).data();if(!t||t.status!=='pending')throw 'Échange déjà traité';if(t.to!==uid)throw 'Non autorisé';
 const fr=doc(db,'users',t.from),to=doc(db,'users',t.to),fs=await tx.get(fr),ts=await tx.get(to);const fi=cl(fs.data().inv||{}),ti=cl(ts.data().inv||{});let fa=fs.data().ac,ta=ts.data().ac;
 for(const c of t.offer.cards){if(!subC(fi,c.id,c.g,c.n))throw t.fromName+' ne possède plus ces cartes';addC(ti,c.id,c.g,c.n)}
 for(const c of t.want.cards){if(!subC(ti,c.id,c.g,c.n))throw 'Tu ne possèdes plus ces cartes';addC(fi,c.id,c.g,c.n)}
 fa+=t.want.ac-t.offer.ac;ta+=t.offer.ac-t.want.ac;if(fa<0||ta<0)throw 'AnimeCoins insuffisants';
 tx.update(fr,{inv:fi,ac:fa,val:invVal(fi)});tx.update(to,{inv:ti,ac:ta,val:invVal(ti)});tx.update(tr,{status:'accepted'});tt=t});
 toast('Échange accepté !');notif(tt.from,`✅ ${tt.toName} a accepté ton échange`)}catch(e){fail(e)}};
A.tDec=async id=>{try{await updateDoc(doc(db,'trades',id),{status:'declined'})}catch(e){fail(e)}};

/* ============ Social : amis & clans ============ */
const chatH=()=>(S.chat||[]).map(m=>`<div><b>${E(m.name)}</b> : ${E(m.t)}</div>`).join('');
function vSoc(){const u=U(),c=S.clan,rows=[...S.cmem].sort((a,b)=>(b.val||0)-(a.val||0));
 return `<div class="grid md:grid-cols-2 gap-4"><div class="glass p-3 space-y-2"><h3 class="font-bold">Amis</h3><div class="flex gap-2"><input id="fn" placeholder="Pseudo ou ID du joueur" class="flex-1"><button class="btn2" data-a="addF">Demander</button></div>
 ${(u.reqs||[]).map(r=>`<div class="flex items-center gap-2 text-sm bg-white/5 rounded p-1"><b class="flex-1">${E(r.name)} veut être ton ami</b><button class="btn2" data-a="reqOk" data-p="${r.uid}|${E(r.name)}">Accepter</button><button class="btn2" data-a="reqNo" data-p="${r.uid}|${E(r.name)}">Refuser</button></div>`).join('')}
 ${Object.entries(S.fr).map(([i,f])=>`<div class="flex items-center gap-2 text-sm"><span>${online(f)?'🟢':'⚫'}</span><span>${E(f.av||'')}</span><b class="flex-1">${E(f.name)}</b><button class="btn2" data-a="tradeWith" data-p="${i}">Proposer un échange</button></div>`).join('')||'<p class="text-sm opacity-60">Aucun ami pour le moment.</p>'}<p class="text-xs opacity-50">Ton ID : ${uid}</p></div>
 <div class="glass p-3 space-y-2"><h3 class="font-bold">Clan ${c?'— '+E(c.name):''}</h3>
 ${c?`<div class="text-sm">${rows.map((r,i)=>`<div class="flex justify-between"><span>${i+1}. ${E(r.name)} ${online(r)?'🟢':''}</span><b>${(r.val||0).toLocaleString()} AC</b></div>`).join('')}</div>
 <div id="chatlog" class="h-40 overflow-auto bg-black/30 rounded p-2 text-xs space-y-1">${chatH()}</div><div class="flex gap-2"><input id="cm" class="flex-1" placeholder="Message…" onkeydown="if(event.key==='Enter')document.getElementById('sendBtn').click()"><button id="sendBtn" class="btn2" data-a="say">Envoyer</button></div><button class="btn2" data-a="leaveC">Quitter le clan</button>`
 :`<p class="text-sm opacity-70">Rejoins un clan de joueurs réels ou crée le tien.</p>${S.clans.map(x=>`<div class="flex justify-between text-sm"><span>${E(x.name)} (${(x.members||[]).length})</span><button class="btn2" data-a="joinC" data-p="${x.id}">Rejoindre</button></div>`).join('')||'<p class="text-sm opacity-60">Aucun clan pour l\'instant.</p>'}<div class="flex gap-2"><input id="cn2" placeholder="Nom du clan" class="flex-1"><button class="btn2" data-a="mkC">Créer</button></div>`}</div></div>`}
A.addF=async()=>{const n=$('#fn').value.trim();if(!n)return;try{let tid=null;const q=await getDocs(query(collection(db,'users'),where('nameL','==',n.toLowerCase()),limit(1)));if(q.docs.length)tid=q.docs[0].id;else{const d=await getDoc(doc(db,'users',n));if(d.exists())tid=d.id}
 if(!tid)return toast('Joueur introuvable');if(tid===uid)return toast('C\'est toi !');if((U().friends||[]).includes(tid))return toast('Déjà ami');
 await updateDoc(doc(db,'users',tid),{reqs:arrayUnion({uid,name:U().name})});notif(tid,`👥 ${U().name} t'a envoyé une demande d'ami`);toast('Demande envoyée')}catch(e){fail(e)}};
A.reqOk=async p=>{const[i,n]=p.split('|'),r={uid:i,name:n},b=writeBatch(db);b.update(ME(),{friends:arrayUnion(i),reqs:arrayRemove(r)});b.update(doc(db,'users',i),{friends:arrayUnion(uid)});await b.commit().catch(fail);notif(i,`👥 ${U().name} a accepté ta demande d'ami`)};
A.reqNo=p=>{const[i,n]=p.split('|');saveU({reqs:arrayRemove({uid:i,name:n})})};
A.tradeWith=async i=>{S.tab='trade';await A.tSel(i)};
A.mkC=async()=>{const n=$('#cn2').value.trim();if(!n)return;const r=await addDoc(collection(db,'clans'),{name:n,owner:uid,members:[uid],ts:Date.now()});await saveU({clan:r.id})};
A.joinC=async id=>{await updateDoc(doc(db,'clans',id),{members:arrayUnion(uid)});await saveU({clan:id})};
A.leaveC=async()=>{const id=U().clan;await updateDoc(doc(db,'clans',id),{members:arrayRemove(uid)}).catch(()=>{});await saveU({clan:null})};
A.say=async()=>{const i=$('#cm'),t=i.value.trim();if(!t||!U().clan)return;i.value='';await addDoc(collection(db,'clans',U().clan,'chat'),{u:uid,name:U().name,t,ts:Date.now()}).catch(fail)};

/* ============ Profil ============ */
const BN=[['Ardoise','linear-gradient(90deg,#1e293b,#0f172a)'],['Indigo','linear-gradient(90deg,#312e81,#1e1b4b)'],['Émeraude','linear-gradient(90deg,#064e3b,#022c22)'],['Bordeaux','linear-gradient(90deg,#581c2e,#2a0f18)']],TI=['Recrue','Collectionneur','Chasseur de Mythiques','Maître des enchères','Gem Mint Hunter','Légende'],AV=['🦊','🐉','🥷','👾','🌸','⚡','🐺','🎴'];
function vProf(){const u=U(),st=stacks(u.inv),m=u.master&&u.inv?.[u.master]?u.master:'';const g10=st.filter(s=>s.g===10).reduce((a,s)=>a+s.n,0);
 return `<div class="rounded-2xl p-4 mb-4 flex items-center gap-4" style="background:${BN[u.banner||0][1]}"><div class="text-5xl">${u.av}</div><div><h2 class="text-2xl font-extrabold">${E(u.name)}</h2><p>${E(u.title)} — ${E(u.bio)}</p></div></div>
 <div class="grid md:grid-cols-2 gap-4"><div class="glass p-4 space-y-3 text-sm"><h3 class="font-bold">Personnalisation</h3>
 <input class="w-full" value="${E(u.name)}" data-c="pName"><input class="w-full" value="${E(u.bio)}" data-c="pBio">
 <select class="w-full" data-c="pTitle">${TI.map(t=>`<option ${u.title===t?'selected':''}>${t}</option>`)}</select>
 <div class="flex gap-1 flex-wrap">${AV.map(a=>`<button class="btn2" data-a="pAv" data-p="${a}">${a}</button>`).join('')}</div>
 <select class="w-full" data-c="pBan">${BN.map((b,i)=>`<option value="${i}" ${(u.banner||0)===i?'selected':''}>Bannière ${b[0]}</option>`)}</select>
 <label class="block">Carte maîtresse <select class="w-full" data-c="pMaster"><option value="">—</option>${Object.keys(u.inv||{}).map(id=>`<option value="${id}" ${m===id?'selected':''}>${E(cd(id).name)} (${R[cd(id).rar].n})</option>`)}</select></label>${m?`<div class="w-40">${card(cd(m))}</div>`:''}</div>
 <div class="glass p-5 space-y-1 text-sm stats"><h3 class="font-semibold mb-2">Statistiques</h3><p>Packs ouverts : <b>${u.opened||0}</b></p><p>Cartes (total) : <b>${st.reduce((a,s)=>a+s.n,0)}</b> · distinctes : <b>${st.length}</b></p><p>Valeur de la collection : <b>${(u.val||0).toLocaleString()} AC</b></p><p>AnimeCoins gagnés (total) : <b>${(u.earned||0).toLocaleString()}</b></p><p>Cartes PSA 10 : <b>${g10}</b></p><p>Wishlist : <b>${(u.wish||[]).length}</b> · Amis : <b>${(u.friends||[]).length}</b></p>
 <h3 class="font-bold pt-3">Paramètres</h3><label class="flex gap-2 items-center"><input type="checkbox" ${u.nsfw?'checked':''} data-c="pNsfw"> Contenu 18+ / NSFW (isAdult)</label>
 <div class="flex gap-2 flex-wrap"><button class="btn2" data-a="exp">⬇ Exporter (JSON)</button><button class="btn2" data-a="resetP">Réinitialiser ma progression</button><button class="btn2" data-a="clearCache">Vider le cache catalogue</button><button class="btn2" data-a="logout">Déconnexion</button></div></div></div>`}
A.pName=v=>{v=v.trim();if(v.length>=3)saveU({name:v,nameL:v.toLowerCase()})};A.pBio=v=>saveU({bio:v});A.pTitle=v=>saveU({title:v});A.pAv=v=>saveU({av:v});A.pBan=v=>saveU({banner:+v});A.pMaster=v=>saveU({master:v});
A.pNsfw=async(v,el)=>{await saveU({nsfw:el.checked});if(el.checked&&!POOL.some(p=>p.adult)){toast('Chargement du contenu 18+…');try{let all=await idbAll();all=await loadPool(ADJ,all);toast('Contenu 18+ chargé')}catch(e){fail(e)}}};
A.exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(U(),null,1)],{type:'application/json'}));a.download='animecards-save.json';a.click()};
A.resetP=async()=>{if(confirm('Réinitialiser cartes, AnimeCoins et stats ?'))await saveU({ac:500,earned:0,packs:10,last:Date.now(),inv:{},val:0,wish:[],opened:0,albums:{},master:''})};
A.clearCache=async()=>{if(confirm('Vider le cache IndexedDB ? Le catalogue sera rechargé.')){await idbClear();location.reload()}};

boot().catch(e=>showErr(e.message||e));
</script></body></html>
